name: Bug report
description: Report a bug in the app
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Briefly: what happened, when, and on which version.
  - type: input
    id: version
    attributes:
      label: App version
      description: Which release the app was installed from (e.g. v1.0)
      placeholder: "v1.0"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android
      description: Phone model and Android version (Settings → About phone)
      placeholder: "Pixel 8, Android 15"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Symptoms — what you did and what went wrong
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact sequence of actions that leads to the bug
      placeholder: "1. Open My books\n2. Tap …\n3. …"
    validations:
      required: true
