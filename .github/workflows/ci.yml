name: Performance collection index verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-collections-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g
      JAVA_TOOL_OPTIONS: -Drobolectric.dependency.repo.url=https://repo.maven.apache.org/maven2
    steps:
      - name: Checkout exact PR candidate
        uses: actions/checkout@v5
        with:
          ref: 9e04c69673d061d49ef0b52c5c42a70fde69a14f
          fetch-depth: 0
          persist-credentials: false
      - name: Check source revision
        run: test "$(git rev-parse HEAD)" = 9e04c69673d061d49ef0b52c5c42a70fde69a14f
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set isolated Gradle home
        run: echo "GRADLE_USER_HOME=$RUNNER_TEMP/perf-gradle-home" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: true
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36.1 build-tools;36.0.0 platform-tools'
      - name: Restore Robolectric runtime artifacts
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-androidall-v1-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: robolectric-androidall-v1-
      - name: Verify path selection before building
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import json, subprocess
          from pathlib import Path
          paths = subprocess.check_output(['git', 'diff', '--name-only', '85c4423b6c608b18162f440ff3044d47e76d6451'], text=True).splitlines()
          paths += subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines()
          command = ['python3', 'scripts/test_partitions.py', 'select']
          for path in paths:
              command.extend(['--changed-file', path])
          selection = json.loads(subprocess.check_output(command, text=True))
          assert not selection['fullSuite'], selection
          print({name: len(classes) for name, classes in selection['partitions'].items()})
          Path('.mutations/evidence').mkdir(parents=True, exist_ok=True)
          Path('.mutations/evidence/preflight-selection.json').write_text(json.dumps(selection, indent=2))
          PYCODE
      - name: Prepare isolated build slot and explicit mutants
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .worktrees .mutations/patches
          cat > .worktrees/gt <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          exec flock .worktrees/.build-slot python3 scripts/build-slot-guard.py --floor-mb 3500 -- "$@"
          SH
          chmod +x .worktrees/gt gradlew
          python3 - <<'PYCODE'
          from pathlib import Path
          import difflib
          path = Path('app/src/main/java/com/slukhayka/audiobooks/data/collections/CollectionMatcher.kt')
          source = path.read_text()
          changes = [('wrong-author-bucket', 'match.titlesByAuthor[author]', 'match.titlesByAuthor.values.firstOrNull()'), ('reverse-title-membership', 'if (normalizedTitle in titles)', 'if (normalizedTitle !in titles)'), ('reverse-author-only-membership', 'if (author in match.authors)', 'if (author !in match.authors)')]
          for name, target, replacement in changes:
              assert source.count(target) == 1
              mutant = source.replace(target, replacement, 1)
              patch = ''.join(difflib.unified_diff(source.splitlines(keepends=True), mutant.splitlines(keepends=True), fromfile='a/' + str(path), tofile='b/' + str(path)))
              Path('.mutations/patches/' + name + '.patch').write_text(patch)
          PYCODE
      - name: Path-selected partitions and AndroidTest compile
        run: .worktrees/gt scripts/test-changed.sh --base 85c4423b6c608b18162f440ff3044d47e76d6451
      - name: Wrong author bucket must be caught
        run: |
          .worktrees/gt scripts/mutate.sh --patch .mutations/patches/wrong-author-bucket.patch --class com.slukhayka.audiobooks.data.collections.CollectionMatcherTest
          scripts/mutate.sh status --class com.slukhayka.audiobooks.data.collections.CollectionMatcherTest
      - name: Reversed title membership must be caught
        run: |
          .worktrees/gt scripts/mutate.sh --patch .mutations/patches/reverse-title-membership.patch --class com.slukhayka.audiobooks.data.collections.CollectionMatcherTest
          scripts/mutate.sh status --class com.slukhayka.audiobooks.data.collections.CollectionMatcherTest
      - name: Reversed author-only membership must be caught
        run: |
          .worktrees/gt scripts/mutate.sh --patch .mutations/patches/reverse-author-only-membership.patch --class com.slukhayka.audiobooks.data.collections.CollectionMatcherTest
          scripts/mutate.sh status --class com.slukhayka.audiobooks.data.collections.CollectionMatcherTest
      - name: Recheck genuine source after all rollbacks
        run: |
          .worktrees/gt ./gradlew :app:validateTestPartitions :app:testPureJvm -Ptest.selectedClasses=com.slukhayka.audiobooks.data.collections.CollectionMatcherTest --no-daemon --stacktrace
          scripts/mutate.sh status --class com.slukhayka.audiobooks.data.collections.CollectionMatcherTest
          git diff --exit-code
      - name: Record source and partition selection
        if: always()
        run: |
          mkdir -p .mutations/evidence
          git rev-parse HEAD > .mutations/evidence/source-head.txt
          python3 scripts/test_partitions.py select --changed-file app/src/main/java/com/slukhayka/audiobooks/data/collections/CollectionMatcher.kt --changed-file app/src/test/java/com/slukhayka/audiobooks/data/collections/CollectionMatcherTest.kt > .mutations/evidence/partitions.json
      - name: Upload bounded verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-collections-verification
          path: |
            .mutations/runs.jsonl
            .mutations/evidence/
            .mutations/artifacts/
            app/build/test-results/testDebugUnitTest/TEST-*.xml
          retention-days: 7
          if-no-files-found: warn
