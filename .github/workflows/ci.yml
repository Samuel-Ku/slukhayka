name: Performance candidate verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-strip-tags-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g
    steps:
      - name: Checkout exact PR candidate
        uses: actions/checkout@v5
        with:
          ref: 4cbf4cf78d823ca0ecd433c6e58dee9a796d2d62
          fetch-depth: 0
          persist-credentials: false
      - name: Check source revision
        run: test "$(git rev-parse HEAD)" = 4cbf4cf78d823ca0ecd433c6e58dee9a796d2d62
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set isolated Gradle home
        run: echo "GRADLE_USER_HOME=$RUNNER_TEMP/perf-gradle-home" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: true
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36.1 build-tools;36.0.0 platform-tools'
      - name: Prepare isolated build slot and explicit mutants
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .worktrees .mutations/patches
          cat > .worktrees/gt <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          exec flock .worktrees/.build-slot python3 scripts/build-slot-guard.py --floor-mb 3500 -- "$@"
          SH
          chmod +x .worktrees/gt gradlew
          python3 - <<'PYCODE'
          from pathlib import Path
          import difflib
          mutants = [('empty-tag-matches', 'app/src/main/java/com/slukhayka/audiobooks/data/source/SourceParsing.kt', 'Regex("""<[^>]+>""")', 'Regex("""<[^>]*>""")'), ('ignore-replacement', 'app/src/main/java/com/slukhayka/audiobooks/data/source/SourceParsing.kt', 'HTML_TAG.replace(input, replacement)', 'HTML_TAG.replace(input, "")')]
          for name, file, original, replacement in mutants:
              path = Path(file)
              source = path.read_text()
              assert source.count(original) >= 1
              mutant = source.replace(original, replacement)
              patch = ''.join(difflib.unified_diff(source.splitlines(keepends=True), mutant.splitlines(keepends=True), fromfile='a/' + file, tofile='b/' + file))
              Path('.mutations/patches/' + name + '.patch').write_text(patch)
          PYCODE
      - name: Path-selected partitions and AndroidTest compile
        run: .worktrees/gt scripts/test-changed.sh --base 85c4423b6c608b18162f440ff3044d47e76d6451
      - name: Catch empty-tag-matches
        run: |
          .worktrees/gt scripts/mutate.sh --patch .mutations/patches/empty-tag-matches.patch --class com.slukhayka.audiobooks.data.source.SourceParsingTest
          scripts/mutate.sh status --class com.slukhayka.audiobooks.data.source.SourceParsingTest
      - name: Catch ignore-replacement
        run: |
          .worktrees/gt scripts/mutate.sh --patch .mutations/patches/ignore-replacement.patch --class com.slukhayka.audiobooks.data.source.SourceParsingTest
          scripts/mutate.sh status --class com.slukhayka.audiobooks.data.source.SourceParsingTest
      - name: Recheck genuine source after all rollbacks
        run: |
          .worktrees/gt ./gradlew :app:validateTestPartitions :app:testPureJvm -Ptest.selectedClasses=com.slukhayka.audiobooks.data.source.SourceParsingTest --no-daemon --stacktrace
          scripts/mutate.sh status --class com.slukhayka.audiobooks.data.source.SourceParsingTest
          git diff --exit-code
      - name: Record source and partition selection
        if: always()
        run: |
          mkdir -p .mutations/evidence
          git rev-parse HEAD > .mutations/evidence/source-head.txt
          python3 scripts/test_partitions.py select --changed-file app/src/main/java/com/slukhayka/audiobooks/data/source/SourceParsing.kt --changed-file app/src/test/java/com/slukhayka/audiobooks/data/source/SourceParsingTest.kt --changed-file app/src/test/java/com/slukhayka/audiobooks/data/source/RunStripTagsBenchmark.kt > .mutations/evidence/partitions.json
      - name: Upload bounded verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-strip-tags-verification
          path: |
            .mutations/runs.jsonl
            .mutations/evidence/
            .mutations/artifacts/
            app/build/test-results/testDebugUnitTest/TEST-*.xml
          retention-days: 7
          if-no-files-found: warn
