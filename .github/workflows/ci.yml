name: Android startup diagnostic

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Immutable source commit to measure
        required: true
        default: 85c4423b6c608b18162f440ff3044d47e76d6451
        type: string
      guard_kind:
        description: Resource guard in focus (all violations stay in the report)
        required: true
        default: BOTH
        type: choice
        options: [BOTH, COIL, ROOM]

permissions:
  contents: read

concurrency:
  group: performance-startup-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g
      SOURCE_REF: ${{ inputs.source_ref }}
      GUARD_KIND: ${{ inputs.guard_kind }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable source and retrieve diagnostic scripts
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_REF"
          git show "$GITHUB_SHA":.github/scripts/prepare-startup-probe.py > "$RUNNER_TEMP/prepare-startup-probe.py"
          git show "$GITHUB_SHA":.github/scripts/run-startup-profile.sh > "$RUNNER_TEMP/run-startup-profile.sh"
          mkdir -p .mutations/evidence/startup-profile .mutations/apks .worktrees
          git rev-parse HEAD > .mutations/evidence/startup-profile/source-head.txt
          cat > .worktrees/gt <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          exec flock .worktrees/.build-slot python3 scripts/build-slot-guard.py --floor-mb 3500 -- "$@"
          SH
          chmod +x .worktrees/gt gradlew
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set isolated Gradle home
        run: echo "GRADLE_USER_HOME=$RUNNER_TEMP/startup-gradle-home" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: true
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36.1 build-tools;36.0.0 platform-tools'
      - name: Restore E5 asset cache
        uses: actions/cache@v6
        with:
          path: app/src/main/assets/models/e5
          key: e5-model-v1
      - name: Build unmodified source APK
        run: |
          .worktrees/gt ./gradlew :app:assembleDebug --no-daemon --max-workers=1 --stacktrace
          git diff --exit-code
          cp app/build/outputs/apk/debug/app-debug.apk .mutations/apks/plain.apk
      - name: Build separate diagnostic APK
        run: |
          python3 "$RUNNER_TEMP/prepare-startup-probe.py"
          .worktrees/gt ./gradlew :app:assembleDebug --no-daemon --max-workers=1 --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk .mutations/apks/probe.apk
          sha256sum .mutations/apks/*.apk > .mutations/evidence/startup-profile/apk-sha256.txt
      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Measure plain APK and assert resource/thread guard
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_atd
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -no-metrics -camera-back none
          script: |
            bash "$RUNNER_TEMP/run-startup-profile.sh" measure
            bash "$RUNNER_TEMP/run-startup-profile.sh" guard
      - name: Upload actual timings, guard, source hashes and raw trace
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: startup-profile-evidence
          path: .mutations/evidence/startup-profile/
          retention-days: 7
          if-no-files-found: warn
