name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, release/v1.3.7-stability, release/v1.3.8]
  pull_request:
    branches: [main, release/v1.3.7-stability, release/v1.3.8]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  release-lineage:
    name: Release branch lineage guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Keep v1.3.7 from being wholesale-merged into main
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "pull_request" ] && \
             [ "$BASE_REF" = "main" ] && \
             [ "$HEAD_REF" = "release/v1.3.7-stability" ]; then
            echo "release/v1.3.7-stability is never merged wholesale into main."
            echo "Forward-port individual fixes through a separate cherry-pick PR."
            exit 1
          fi

          # The merge-base==v1.3.6 and no-merge-commits checks were dropped:
          # main fast-forwarded over the release line, and the release line
          # itself carries legitimate lane-merge commits. The remaining
          # invariant is the wholesale-merge block above.

  timing-start:
    name: Start workflow timer
    runs-on: ubuntu-latest
    outputs:
      epoch: ${{ steps.timer.outputs.epoch }}
    steps:
      - id: timer
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

  jvm-partitions:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: timing-start
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: pure-jvm
            name: Pure JVM
            task: :app:testPureJvm
            needs-model: true
          - id: room-robolectric
            name: Room + Robolectric
            task: :app:testRoomRobolectric
            needs-model: false
          - id: compose-roborazzi
            name: Compose + Roborazzi
            task: :app:testComposeRoborazzi
            needs-model: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Cache e5 model
        if: matrix.needs-model
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/models/e5
          key: e5-model-v1

      - name: Download e5 model for production embedder tests
        if: matrix.needs-model
        run: ./gradlew :app:downloadE5Model --no-daemon

      - name: Validate classification and run ${{ matrix.name }}
        run: |
          started_at=$(date +%s)
          mkdir -p app/build/kover/partition app/build/test-results/partition
          if [ "${{ matrix.id }}" = "room-robolectric" ]; then
            rm -f app/build/test-worker-identities.tsv
            ./gradlew :app:validateTestPartitions :app:testRoomNativeSdk35 --no-daemon --stacktrace
            cp app/build/kover/bin-reports/testDebugUnitTest.ic app/build/kover/partition/native-sdk35.ic
            cp -R app/build/test-results/testDebugUnitTest app/build/test-results/partition/native-sdk35
            ./gradlew :app:testRoomNativeSdk36 --no-daemon --stacktrace
            cp app/build/kover/bin-reports/testDebugUnitTest.ic app/build/kover/partition/native-sdk36.ic
            cp -R app/build/test-results/testDebugUnitTest app/build/test-results/partition/native-sdk36
            ./gradlew :app:testRoomNativeDefault --no-daemon --stacktrace
            cp app/build/kover/bin-reports/testDebugUnitTest.ic app/build/kover/partition/native-default.ic
            cp -R app/build/test-results/testDebugUnitTest app/build/test-results/partition/native-default
            ./gradlew :app:testRoomRobolectricOnly --no-daemon --stacktrace
            cp app/build/kover/bin-reports/testDebugUnitTest.ic app/build/kover/partition/robolectric-only.ic
            test "$(cut -f1 app/build/test-worker-identities.tsv | sort -u | wc -l)" -eq 2
            test "$(cut -f2 app/build/test-worker-identities.tsv | sort -u | wc -l)" -eq 2
          else
            ./gradlew :app:validateTestPartitions ${{ matrix.task }} --no-daemon --stacktrace
            cp app/build/kover/bin-reports/testDebugUnitTest.ic app/build/kover/partition/${{ matrix.id }}.ic
          fi
          elapsed=$(( $(date +%s) - started_at ))
          echo "${{ matrix.name }}: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload partition coverage
        uses: actions/upload-artifact@v4
        with:
          name: kover-${{ matrix.id }}
          path: app/build/kover/partition/
          if-no-files-found: error
          retention-days: 2

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.id }}
          path: app/build/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Roborazzi failure artifacts
        if: always() && matrix.id == 'compose-roborazzi'
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-results
          path: |
            app/build/outputs/roborazzi/
            app/build/reports/roborazzi/
          if-no-files-found: warn
          retention-days: 14

  coverage:
    name: Kover aggregate gate
    needs: [timing-start, jvm-partitions]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Download all partition coverage
        uses: actions/download-artifact@v4
        with:
          pattern: kover-*
          path: app/build/kover/ci

      - name: Require all partition reports
        run: test "$(find app/build/kover/ci -name '*.ic' | wc -l)" -eq 6

      - name: Generate merged reports and enforce thresholds
        run: |
          chmod +x ./gradlew
          ./gradlew :app:koverXmlReport :app:koverHtmlReport :app:koverVerify \
            -x :app:testDebugUnitTest \
            -Pkover.additionalBinaryReportsDir=build/kover/ci \
            -Pkover.instructionThreshold=15 \
            -Pkover.branchThreshold=9 \
            --no-daemon --stacktrace
          python3 scripts/verify_partition_coverage.py app/build/reports/kover/report.xml

      - name: Upload Kover HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kover-html-report
          path: app/build/reports/kover/html/
          retention-days: 14

      - name: Upload Kover XML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kover-xml-report
          path: app/build/reports/kover/report.xml
          retention-days: 14

  recommendation-eval:
    name: Recommendation eval
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: timing-start

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Cache e5 model
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/models/e5
          key: e5-model-v1

      - name: Download e5 model
        run: ./gradlew :app:downloadE5Model --no-daemon

      - name: Recommendation eval gate (real ONNX model)
        run: ./gradlew :app:runRecommendationEval --no-daemon
        env:
          FAIL_ON_NO_GO: "true"

  accessibility-api35:
    name: Accessibility journey (API 35)
    needs: [release-lineage, timing-start]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    # Release decision (v1.3.7): the journey reports but does not block. The
    # 48dp touch-target gate currently conflicts with the tightened person
    # rows, and the emulator focus-return wait is flaky on CI runners. Revisit
    # both after the release ships.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install compile SDK 36.1
        run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0" "platform-tools"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # #424: build both APKs before the emulator starts so a 15-minute AVD
      # boot never hides a compile failure, and the readiness script inside
      # the journey sees the packages already installed.
      - name: Prebuild accessibility APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --max-workers=1 --stacktrace

      # GitHub's Linux runner exposes /dev/kvm, but the default permissions do
      # not let the emulator use it. Without KVM the API 35 device can become
      # unresponsive while installing the APK and turn a short journey into a
      # 20+ minute infrastructure failure.
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the seeded MainActivity accessibility journey
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_atd
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -no-metrics -camera-back none
          # The action invokes a multiline script one line at a time, so shell
          # variables do not survive between lines. Keep status capture and
          # logcat collection in one repository script instead.
          script: bash .github/scripts/run-accessibility-test.sh

      - name: Upload API 35 accessibility results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-api35-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 14

  signed-smoke-apk:
    name: Signed v1.3.7 smoke APK
    needs: [jvm-partitions, accessibility-api35]
    if: github.event_name == 'push' && github.ref == 'refs/heads/release/v1.3.7-stability'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install compile SDK 36.1
        run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0" "platform-tools"

      - name: Restore release credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_RELEASE_JSON_BASE64 }}
        run: |
          set -eu
          test -n "$KEYSTORE_BASE64"
          test -n "$GOOGLE_SERVICES_JSON_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/upload.jks"
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
          chmod 600 "${{ runner.temp }}/upload.jks"
          python3 -m json.tool app/google-services.json >/dev/null

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: "${{ runner.temp }}/upload.jks"
          STORE_PASSWORD: "${{ secrets.STORE_PASSWORD }}"
          KEY_PASSWORD: "${{ secrets.KEY_PASSWORD }}"
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Upload signed smoke APK
        uses: actions/upload-artifact@v4
        with:
          name: slukhayka-v1.3.7-signed-smoke
          path: app/build/outputs/renamed_apks/release/slukhayka-v1.3.7.apk
          if-no-files-found: error
          retention-days: 3

  timing-summary:
    name: Workflow timing
    if: always()
    needs: [timing-start, coverage, recommendation-eval, accessibility-api35]
    runs-on: ubuntu-latest
    steps:
      - name: Record end-to-end elapsed time
        env:
          STARTED_AT: ${{ needs.timing-start.outputs.epoch }}
        run: |
          elapsed=$(( $(date +%s) - STARTED_AT ))
          echo "End to end: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"
