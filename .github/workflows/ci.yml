name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  release-lineage:
    name: Release branch lineage guard
    runs-on: ubuntu-latest
    steps:
      # Env-only guard: no checkout needed since the merge-base and
      # no-merge-commits checks were dropped.
      - name: Keep release lanes from being wholesale-merged into main
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$BASE_REF" = "main" ]; then
            case "$HEAD_REF" in
              release/*)
                echo "$HEAD_REF is never merged wholesale into main."
                echo "Forward-port individual fixes through a separate cherry-pick PR (RELEASE-BRANCH.md)."
                exit 1
                ;;
            esac
          fi

          # The merge-base==v1.3.6 and no-merge-commits checks were dropped:
          # main fast-forwarded over the release line, and the release line
          # itself carries legitimate lane-merge commits. The remaining
          # invariant is the wholesale-merge block above, matching any release
          # lane since v1.3.8 (2026-09: triggers and this guard are
          # version-agnostic — a new release branch needs no ci.yml edits).

  timing-start:
    name: Start workflow timer
    runs-on: ubuntu-latest
    outputs:
      epoch: ${{ steps.timer.outputs.epoch }}
    steps:
      - id: timer
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

  # Six parallel legs over the three public JVM partitions (#423): pure JVM,
  # four Room cohorts, Compose+Roborazzi. Until 2026-09 the four Room cohorts
  # ran sequentially inside one job — a failure in an early cohort hid the
  # remaining cohorts, and four cold --no-daemon Gradle starts dominated the
  # critical path (~23 of the ~30 end-to-end minutes). One cohort per runner
  # pins the wall clock at the slowest cohort and always reports every cohort.
  jvm-partitions:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: timing-start
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: pure-jvm
            name: Pure JVM
            tasks: ":app:validateTestPartitions :app:testPureJvm"
            ic: pure-jvm.ic
            needs-model: true
          - id: room-native-sdk35
            name: Room native SDK 35
            tasks: ":app:validateTestPartitions :app:testRoomNativeSdk35"
            ic: native-sdk35.ic
            needs-robolectric: true
            uploads-worker-id: true
          - id: room-native-sdk36
            name: Room native SDK 36
            tasks: ":app:validateTestPartitions :app:testRoomNativeSdk36"
            ic: native-sdk36.ic
            needs-robolectric: true
            uploads-worker-id: true
          - id: room-native-default
            name: Room native default SDK
            tasks: ":app:validateTestPartitions :app:testRoomNativeDefault"
            ic: native-default.ic
            needs-robolectric: true
          - id: room-robolectric-only
            name: Room Robolectric-only
            tasks: ":app:validateTestPartitions :app:testRoomRobolectricOnly"
            ic: robolectric-only.ic
            needs-robolectric: true
          - id: compose-roborazzi
            name: Compose + Roborazzi
            tasks: ":app:validateTestPartitions :app:testComposeRoborazzi"
            ic: compose-roborazzi.ic
            needs-robolectric: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          # PR legs only read caches written by push runs; otherwise every
          # parallel leg saves its own multi-hundred-MB near-duplicate into
          # the 10 GB cache pool and evicts useful entries.
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # compileSdk is 36.1 — install it explicitly everywhere so AGP
          # never pays an implicit sdkmanager download per job.
          packages: 'platforms;android-36.1 build-tools;36.0.0 platform-tools'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Cache e5 model
        if: matrix.needs-model
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/models/e5
          key: e5-model-v1

      - name: Cache Robolectric android-all jars
        if: matrix.needs-robolectric
        uses: actions/cache@v4
        with:
          # Robolectric resolves its ~100 MB-per-SDK android-all jars at test
          # runtime into the local Maven repo, which setup-gradle does not
          # cache. Without this every Robolectric leg re-downloads ~0.5 GB.
          path: ~/.m2/repository/org/robolectric
          key: robolectric-androidall-v1-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: robolectric-androidall-v1-

      - name: Run ${{ matrix.name }}
        run: |
          started_at=$(date +%s)
          mkdir -p app/build/kover/partition
          ./gradlew ${{ matrix.tasks }} --no-daemon --stacktrace
          cp app/build/kover/bin-reports/testDebugUnitTest.ic "app/build/kover/partition/${{ matrix.ic }}"
          elapsed=$(( $(date +%s) - started_at ))
          echo "${{ matrix.name }}: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload worker-identity fragment
        if: matrix.uploads-worker-id
        uses: actions/upload-artifact@v4
        with:
          name: worker-ids-${{ matrix.id }}
          path: app/build/test-worker-identities.tsv
          if-no-files-found: error
          retention-days: 2

      - name: Upload partition coverage
        uses: actions/upload-artifact@v4
        with:
          name: kover-${{ matrix.id }}
          path: app/build/kover/partition/
          if-no-files-found: error
          retention-days: 2

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.id }}
          path: app/build/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Roborazzi failure artifacts
        if: always() && matrix.id == 'compose-roborazzi'
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-results
          path: |
            app/build/outputs/roborazzi/
            app/build/reports/roborazzi/
          if-no-files-found: warn
          retention-days: 14

  coverage:
    name: Kover aggregate gate
    needs: [timing-start, jvm-partitions]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36.1 build-tools;36.0.0 platform-tools'

      - name: Download all partition coverage
        uses: actions/download-artifact@v4
        with:
          pattern: kover-*
          path: app/build/kover/ci

      - name: Download worker-identity fragments
        uses: actions/download-artifact@v4
        with:
          pattern: worker-ids-*
          path: app/build/worker-ids

      - name: Require all partition reports
        run: test "$(find app/build/kover/ci -name '*.ic' | wc -l)" -eq 6

      - name: Require both native worker probes
        run: |
          # NativeRoomWorkerIdentity appends one "pid<TAB>sdk=NN;sqlite=framework"
          # row per probe test (@AfterClass): RecommendationPreferencesRoomTest
          # (sdk 35, room-native-sdk35 leg) and StoredMetadataScrubRoomTest
          # (sdk 36, room-native-sdk36 leg). The union over both legs must show
          # two probes in two distinct JVMs — evidence that incompatible
          # native SQLite cohorts stayed isolated. room-native-default carries
          # no probe. (Before the 2026-09 split this assertion ran at the end
          # of the single Room job over the same union of rows.)
          union="$RUNNER_TEMP/worker-identities.tsv"
          find app/build/worker-ids -type f -name 'test-worker-identities.tsv' -exec cat {} + > "$union"
          test "$(wc -l < "$union")" -eq 2
          test "$(cut -f1 "$union" | sort -u | wc -l)" -eq 2
          test "$(cut -f2 "$union" | sort -u | wc -l)" -eq 2

      - name: Generate merged reports and enforce thresholds
        run: |
          chmod +x ./gradlew
          ./gradlew :app:koverXmlReport :app:koverHtmlReport :app:koverVerify \
            -x :app:testDebugUnitTest \
            -Pkover.additionalBinaryReportsDir=build/kover/ci \
            -Pkover.instructionThreshold=15 \
            -Pkover.branchThreshold=9 \
            --no-daemon --stacktrace
          python3 scripts/verify_partition_coverage.py app/build/reports/kover/report.xml

      - name: Upload Kover HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kover-html-report
          path: app/build/reports/kover/html/
          retention-days: 14

      - name: Upload Kover XML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kover-xml-report
          path: app/build/reports/kover/report.xml
          retention-days: 14

  recommendation-eval:
    name: Recommendation eval
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: timing-start

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36.1 build-tools;36.0.0 platform-tools'

      - name: Cache e5 model
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/models/e5
          key: e5-model-v1

      - name: Download e5 model
        run: ./gradlew :app:downloadE5Model --no-daemon

      - name: Recommendation eval gate (real ONNX model)
        run: ./gradlew :app:runRecommendationEval --no-daemon
        env:
          FAIL_ON_NO_GO: "true"

  # Push/manual only since 2026-09: the journey is report-only and failed
  # 6/6 recent runs, so pull requests paid ~8 minutes of runner time for a
  # constant red mark. Push lanes and workflow_dispatch still produce the
  # report.
  accessibility-api35:
    name: Accessibility journey (API 35)
    needs: [release-lineage, timing-start]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    # A signed candidate must pass the real listener accessibility journey.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36.1 build-tools;36.0.0 platform-tools'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # GitHub's Linux runner exposes /dev/kvm, but the default permissions do
      # not let the emulator use it. Without KVM the API 35 device can become
      # unresponsive while installing the APK and turn a short journey into a
      # 20+ minute infrastructure failure.
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the seeded MainActivity accessibility journey
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -no-metrics -camera-back none
          # The action invokes a multiline script one line at a time, so shell
          # variables do not survive between lines. Keep status capture and
          # logcat collection in one repository script instead.
          script: bash .github/scripts/run-accessibility-test.sh

      - name: Upload API 35 accessibility results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-api35-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 14

  # Any release lane on push. The artifact name is derived from the built
  # APK's own versionName (renameReleaseApk), so a new release branch needs
  # no edits here.
  signed-smoke-apk:
    name: Signed smoke APK
    needs: [jvm-partitions, accessibility-api35]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36.1 build-tools;36.0.0 platform-tools'

      - name: Restore release credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_RELEASE_JSON_BASE64 }}
        run: |
          set -eu
          test -n "$KEYSTORE_BASE64"
          test -n "$GOOGLE_SERVICES_JSON_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/upload.jks"
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
          chmod 600 "${{ runner.temp }}/upload.jks"
          python3 -m json.tool app/google-services.json >/dev/null

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: "${{ runner.temp }}/upload.jks"
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      # assembleRelease emits app/build/outputs/renamed_apks/release/
      # slukhayka-v<versionName>.apk (the renameReleaseApk task), so the
      # name can never drift from what is inside the file.
      - name: Locate the versioned APK
        id: apk
        run: |
          apk=$(find app/build/outputs/renamed_apks/release -name '*.apk' | head -n 1)
          test -n "$apk"
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          echo "artifact-name=$(basename "$apk" .apk)-signed-smoke" >> "$GITHUB_OUTPUT"

      - name: Upload signed smoke APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.artifact-name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 3

  timing-summary:
    name: Workflow timing
    if: always()
    needs: [timing-start, coverage, recommendation-eval, accessibility-api35]
    runs-on: ubuntu-latest
    steps:
      - name: Record end-to-end elapsed time
        env:
          STARTED_AT: ${{ needs.timing-start.outputs.epoch }}
        run: |
          elapsed=$(( $(date +%s) - STARTED_AT ))
          echo "End to end: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"
