---
name: Recommendation candidate verification
permissions:
  contents: read
concurrency:
  group: recommendation-1825-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g"
      JAVA_TOOL_OPTIONS: "-Drobolectric.dependency.repo.url=https://repo.maven.apache.org/maven2"
    steps:
    - name: Checkout exact PR candidate
      uses: actions/checkout@v5
      with:
        ref: b0cba66b7c8fe6b78db2da3aefe8780e659b02fd
        fetch-depth: 0
        persist-credentials: false
    - name: Check source revision
      run: test "$(git rev-parse HEAD)" = b0cba66b7c8fe6b78db2da3aefe8780e659b02fd
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '21'
    - name: Set isolated Gradle home
      run: echo "GRADLE_USER_HOME=$RUNNER_TEMP/perf-gradle-home" >> "$GITHUB_ENV"
    - uses: gradle/actions/setup-gradle@v6
      with:
        gradle-version: wrapper
        cache-read-only: true
    - uses: android-actions/setup-android@v4
      with:
        packages: platforms;android-36.1 build-tools;36.0.0 platform-tools
    - name: Restore Robolectric runtime artifacts
      uses: actions/cache@v6
      with:
        path: "~/.m2/repository/org/robolectric"
        key: robolectric-androidall-v1-${{ hashFiles('gradle/libs.versions.toml')
          }}
        restore-keys: robolectric-androidall-v1-
    - name: Prepare canonical full selection and bounded mutation witnesses
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p .worktrees .mutations/patches .mutations/evidence
        cat > .worktrees/gt <<'SH'
        #!/usr/bin/env bash
        set -euo pipefail
        exec flock .worktrees/.build-slot python3 scripts/build-slot-guard.py --floor-mb 3500 -- "$@"
        SH
        cat > .worktrees/gradlew-record <<'PYWRAP'
        #!/usr/bin/env python3
        import os,sys,subprocess,json,shutil,xml.etree.ElementTree as E
        from pathlib import Path
        root=Path(__file__).resolve().parent.parent
        result=subprocess.run([str(root/'gradlew'),'--max-workers=2',*sys.argv[1:]],cwd=root)
        tasks={'testPureJvm','testRoomNativeSdk35','testRoomNativeSdk36','testRoomNativeDefault','testRoomRobolectricOnly','testComposeRoborazzi'}
        for arg in sys.argv[1:]:
         name=arg.removeprefix(':app:')
         if name not in tasks:continue
         dest=root/'.mutations/evidence'/os.environ.get('RECOMMEND_VERIFY_PHASE','full')/name;dest.mkdir(parents=True,exist_ok=True);suites=[]
         for f in (root/'app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'):
          shutil.copy2(f,dest/f.name);suites.append(E.parse(f).getroot())
         totals={k:sum(int(s.get(k,'0')) for s in suites) for k in ['tests','failures','errors','skipped']}
         (dest/'result.json').write_text(json.dumps({'task':name,'exit_code':result.returncode,'classes':len(suites),'totals':totals},indent=2)+'\n')
        sys.exit(result.returncode)
        PYWRAP
        chmod +x .worktrees/gt .worktrees/gradlew-record gradlew
        echo "SLUKHAYKA_GRADLEW=$GITHUB_WORKSPACE/.worktrees/gradlew-record" >> "$GITHUB_ENV"
        python3 - <<'PYCODE'
        from pathlib import Path
        import difflib,json,subprocess,hashlib
        base='6258b058278fe4a0ceec04eb1b67ee5a89bc7f92'
        paths=subprocess.check_output(['git','diff','--name-only',base],text=True).splitlines()
        a=['python3','scripts/test_partitions.py','select']
        for p in paths:a.extend(['--changed-file',p])
        s=json.loads(subprocess.check_output(a,text=True));assert s['fullSuite'],s
        Path('.mutations/evidence/preflight-selection.json').write_text(json.dumps(s,indent=2)+'\n')
        Path('.mutations/evidence/source-head.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD'],text=True))
        mutants=[
         ('truncate-negatives','app/src/main/java/com/slukhayka/audiobooks/data/recommend/LocalRecommendationRanker.kt','val negative = ordered.filter { it.weight < 0 }','val negative = ordered.filter { it.weight < 0 }.take(64)'),
         ('disable-partial-fallback','app/src/main/java/com/slukhayka/audiobooks/data/recommend/LocalRecommendationRanker.kt','if (graph != null && graph.containsWork(candidate.id) && graph.containsWork(signal.id))','if (graph != null)'),
         ('disable-redirect-proxy-check','scripts/recommend/public_catalog_http.py','    require_direct_transport(host)\n',''),
         ('whitespace-key-drift','scripts/recommend/merge_key.py','ch == " " or ch.isalnum()','ch.isspace() or ch.isalnum()')]
        rows=[]
        for name,p,old,new in mutants:
         source=Path(p).read_text();assert source.count(old)==1,(name,source.count(old));mutated=source.replace(old,new)
         patch=''.join(difflib.unified_diff(source.splitlines(True),mutated.splitlines(True),fromfile='a/'+p,tofile='b/'+p));Path('.mutations/patches',name+'.patch').write_text(patch)
         rows.append({'mutation':name,'path':p,'pristine_sha256':hashlib.sha256(source.encode()).hexdigest(),'patch_sha256':hashlib.sha256(patch.encode()).hexdigest()})
        Path('.mutations/evidence/mutant-preparation.json').write_text(json.dumps(rows,indent=2)+'\n')
        PYCODE
    - name: Compile device tests before full fallback
      run: ".worktrees/gt ./gradlew :app:compileDebugAndroidTestKotlin --max-workers=2
        --no-daemon --stacktrace"
    - name: Run all six full partitions through path entry point
      env:
        RECOMMEND_VERIFY_PHASE: full
      run: ".worktrees/gt scripts/test-changed.sh --base 6258b058278fe4a0ceec04eb1b67ee5a89bc7f92"
    - name: Android Lint
      run: ".worktrees/gt ./gradlew :app:lintDebug --max-workers=2 --no-daemon --stacktrace"
    - name: Catch truncate-negatives
      env:
        RECOMMEND_VERIFY_PHASE: truncate-negatives
      run: ".worktrees/gt scripts/mutate.sh --patch .mutations/patches/truncate-negatives.patch
        --class com.slukhayka.audiobooks.data.recommend.RecommendationQualityRegressionTest"
    - name: Catch disable-partial-fallback
      env:
        RECOMMEND_VERIFY_PHASE: disable-partial-fallback
      run: ".worktrees/gt scripts/mutate.sh --patch .mutations/patches/disable-partial-fallback.patch
        --class com.slukhayka.audiobooks.data.recommend.RecommendationQualityRegressionTest"
    - name: Genuine Kotlin witness after both rollbacks
      env:
        RECOMMEND_VERIFY_PHASE: genuine
      run: |-
        .worktrees/gt scripts/test-changed.sh --changed-file app/src/test/java/com/slukhayka/audiobooks/data/recommend/RecommendationQualityRegressionTest.kt
        scripts/mutate.sh status --class com.slukhayka.audiobooks.data.recommend.RecommendationQualityRegressionTest > .mutations/evidence/kotlin-genuine-status.json
        git diff --exit-code
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install only free test dependency
      run: python3 -m pip install numpy==2.2.6
    - name: Run recommendation worker domain tests
      run: python3 -m unittest scripts.tests.test_public_catalog_http scripts.tests.test_recommend_graph
        scripts.tests.test_recommend_unit
    - name: Catch disable-redirect-proxy-check
      run: scripts/mutate.sh --patch .mutations/patches/disable-redirect-proxy-check.patch
        --python scripts/tests/test_public_catalog_http.py
    - name: Genuine test_public_catalog_http after rollback
      run: |-
        python3 scripts/mutation_python_runner.py --tests-dir scripts/tests --target test_public_catalog_http --artifact .mutations/artifacts/TEST-test_public_catalog_http.xml
        scripts/mutate.sh status --python scripts/tests/test_public_catalog_http.py > .mutations/evidence/disable-redirect-proxy-check-genuine-status.json
        git diff --exit-code
    - name: Catch whitespace-key-drift
      run: scripts/mutate.sh --patch .mutations/patches/whitespace-key-drift.patch
        --python scripts/tests/test_recommend_graph.py::CatalogTest
    - name: Genuine test_recommend_graph.CatalogTest after rollback
      run: |-
        python3 scripts/mutation_python_runner.py --tests-dir scripts/tests --target test_recommend_graph.CatalogTest --artifact .mutations/artifacts/TEST-test_recommend_graph.CatalogTest.xml
        scripts/mutate.sh status --python scripts/tests/test_recommend_graph.py::CatalogTest > .mutations/evidence/whitespace-key-drift-genuine-status.json
        git diff --exit-code
    - name: Validate final source and evidence
      shell: bash
      run: |
        python3 - <<'PYCODE'
        from pathlib import Path
        import subprocess,json
        pin='b0cba66b7c8fe6b78db2da3aefe8780e659b02fd';out=Path('.mutations/evidence')
        assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==pin
        assert not subprocess.check_output(['git','status','--porcelain'],text=True).strip()
        parts=[json.loads(p.read_text()) for p in (out/'full').glob('*/result.json')]
        assert len(parts)==6,parts
        assert all(x['exit_code']==0 and x['totals']['tests']>0 and x['totals']['failures']==0 and x['totals']['errors']==0 for x in parts)
        records=[json.loads(x) for x in Path('.mutations/runs.jsonl').read_text().splitlines()]
        assert len(records)==4,records
        assert all(x['head']==pin and x['outcome']=='killed' and x['restored'] for x in records)
        for p in [out/'kotlin-genuine-status.json',out/'disable-redirect-proxy-check-genuine-status.json',out/'whitespace-key-drift-genuine-status.json']:
         assert json.loads(p.read_text())['verdict']=='genuine',p
        (out/'verification.complete.json').write_text(json.dumps({'source_commit':pin,'all_six_full_partitions':parts,'mutations':[{k:x[k] for k in ['runId','mutation','outcome','tests','failures','errors','restored']} for x in records],'tree_clean':True,'release_credentials_accessed':False},indent=2)+'\n')
        PYCODE
    - name: Record source even when validation fails
      if: always()
      run: |-
        mkdir -p .mutations/evidence
        git rev-parse HEAD > .mutations/evidence/final-source-head.txt
        git status --porcelain > .mutations/evidence/final-source-status.txt
    - name: Upload bounded verification evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: recommendation-1825-b0cba66b-verification
        path: |-
          .mutations/runs.jsonl
          .mutations/evidence/
          .mutations/artifacts/
          app/build/test-results/testDebugUnitTest/TEST-*.xml
          app/build/outputs/roborazzi/
        retention-days: 7
        if-no-files-found: warn
'on':
  workflow_dispatch: 
