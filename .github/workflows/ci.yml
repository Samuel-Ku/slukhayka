name: Performance candidate verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-edition-memo-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g
      JAVA_TOOL_OPTIONS: -Drobolectric.dependency.repo.url=https://repo.maven.apache.org/maven2
    steps:
      - name: Checkout exact PR candidate
        uses: actions/checkout@v5
        with:
          ref: 6ccf08b2cbbe2625ce840e2477b27509cfcababd
          fetch-depth: 0
          persist-credentials: false
      - name: Check source revision
        run: test "$(git rev-parse HEAD)" = 6ccf08b2cbbe2625ce840e2477b27509cfcababd
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set isolated Gradle home
        run: echo "GRADLE_USER_HOME=$RUNNER_TEMP/perf-gradle-home" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: true
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36.1 build-tools;36.0.0 platform-tools'
      - name: Restore Robolectric runtime artifacts
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-androidall-v1-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: robolectric-androidall-v1-
      - name: Verify path selection before building
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import json, subprocess
          from pathlib import Path
          paths = subprocess.check_output(['git', 'diff', '--name-only', '85c4423b6c608b18162f440ff3044d47e76d6451'], text=True).splitlines()
          paths += subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines()
          command = ['python3', 'scripts/test_partitions.py', 'select']
          for path in paths:
              command.extend(['--changed-file', path])
          selection = json.loads(subprocess.check_output(command, text=True))
          assert not selection['fullSuite'], selection
          print({name: len(classes) for name, classes in selection['partitions'].items()})
          Path('.mutations/evidence').mkdir(parents=True, exist_ok=True)
          Path('.mutations/evidence/preflight-selection.json').write_text(json.dumps(selection, indent=2))
          PYCODE
      - name: Prepare isolated build slot and explicit mutants
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .worktrees .mutations/patches
          cat > .worktrees/gt <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          exec flock .worktrees/.build-slot python3 scripts/build-slot-guard.py --floor-mb 3500 -- "$@"
          SH
          chmod +x .worktrees/gt gradlew
          python3 - <<'PYCODE'
          from pathlib import Path
          import difflib
          mutants = [
              ('work-only-cache-key', 'app/src/main/java/com/slukhayka/audiobooks/data/EditionId.kt', 'recentIds[input]', 'recentIds[input.substringBefore("\\u0000")]'),
              ('missing-cache-language', 'app/src/main/java/com/slukhayka/audiobooks/data/EditionId.kt', 'recentIds[input]', 'recentIds[input.substringBeforeLast("\\u0000")]'),
              ('corrupt-cache-hit', 'app/src/main/java/com/slukhayka/audiobooks/data/EditionId.kt', 'recentIds[input]?.let { return it }', 'recentIds[input]?.let { return "" }'),
          ]
          for name, file, original, replacement in mutants:
              path = Path(file)
              source = path.read_text()
              expected = 2 if original == 'recentIds[input]' else 1
              assert source.count(original) == expected
              mutant = source.replace(original, replacement)
              patch = ''.join(difflib.unified_diff(source.splitlines(keepends=True), mutant.splitlines(keepends=True), fromfile='a/' + file, tofile='b/' + file))
              Path('.mutations/patches/' + name + '.patch').write_text(patch)
          PYCODE
      - name: Path-selected partitions and AndroidTest compile
        run: .worktrees/gt scripts/test-changed.sh --base 85c4423b6c608b18162f440ff3044d47e76d6451
      - name: Catch work-only-cache-key
        run: |
          .worktrees/gt scripts/mutate.sh --patch .mutations/patches/work-only-cache-key.patch --class com.slukhayka.audiobooks.data.EditionIdTest
          scripts/mutate.sh status --class com.slukhayka.audiobooks.data.EditionIdTest
      - name: Catch missing-cache-language
        run: |
          .worktrees/gt scripts/mutate.sh --patch .mutations/patches/missing-cache-language.patch --class com.slukhayka.audiobooks.data.EditionIdTest
          scripts/mutate.sh status --class com.slukhayka.audiobooks.data.EditionIdTest
      - name: Catch corrupt-cache-hit
        run: |
          .worktrees/gt scripts/mutate.sh --patch .mutations/patches/corrupt-cache-hit.patch --class com.slukhayka.audiobooks.data.EditionIdTest
          scripts/mutate.sh status --class com.slukhayka.audiobooks.data.EditionIdTest
      - name: Recheck genuine source after all rollbacks
        run: |
          .worktrees/gt ./gradlew :app:validateTestPartitions :app:testPureJvm -Ptest.selectedClasses=com.slukhayka.audiobooks.data.EditionIdTest --no-daemon --stacktrace
          scripts/mutate.sh status --class com.slukhayka.audiobooks.data.EditionIdTest
          git diff --exit-code
      - name: Record actual compiled JVM comparison probes
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import json, os, subprocess
          output = Path('.mutations/evidence')
          roots = []
          for name in ['EditionId', 'RunEditionMemoBenchmark']:
              files = list(Path('app/build/intermediates/built_in_kotlinc').rglob(name + '.class'))
              assert len(files) == 1, files
              roots.append(str(files[0].parents[4]))
          libraries = list(Path(os.environ['GRADLE_USER_HOME']).rglob('kotlin-stdlib-2.2.21.jar'))
          assert libraries
          command = ['java', '-Xmx256m', '-cp', os.pathsep.join(roots + [str(libraries[0])]), 'com.slukhayka.audiobooks.data.RunEditionMemoBenchmark']
          (output / 'jvm-benchmark-command.json').write_text(json.dumps(command))
          for number in range(1, 4):
              with (output / f'edition-memo-jvm-{number}.txt').open('w') as result:
                  subprocess.run(command, stdout=result, stderr=subprocess.STDOUT, check=True)
          PYCODE
      - name: Record source and partition selection
        if: always()
        run: |
          mkdir -p .mutations/evidence
          git rev-parse HEAD > .mutations/evidence/source-head.txt
          python3 scripts/test_partitions.py select --changed-file app/src/main/java/com/slukhayka/audiobooks/data/EditionId.kt --changed-file app/src/test/java/com/slukhayka/audiobooks/data/EditionIdTest.kt > .mutations/evidence/partitions.json
      - name: Upload bounded verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-edition-memo-verification
          path: |
            .mutations/runs.jsonl
            .mutations/evidence/
            .mutations/artifacts/
            app/build/test-results/testDebugUnitTest/TEST-*.xml
          retention-days: 7
          if-no-files-found: warn
