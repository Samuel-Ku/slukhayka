name: Android ART Edition memo verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-art-edition-memo-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g
    steps:
      - name: Checkout declared base for standalone memo diagnostics
        uses: actions/checkout@v5
        with:
          ref: 85c4423b6c608b18162f440ff3044d47e76d6451
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set isolated Gradle home
        run: echo "GRADLE_USER_HOME=$RUNNER_TEMP/art-gradle-home" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: true
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36.1 build-tools;36.0.0 platform-tools'
      - name: Restore E5 asset cache
        uses: actions/cache@v6
        with:
          path: app/src/main/assets/models/e5
          key: e5-model-v1
      - name: Prepare exact candidates and committed reference probes
        shell: bash
        run: |
          set -euo pipefail
          git show "$GITHUB_SHA":.github/scripts/prepare-art-perf.py > "$RUNNER_TEMP/prepare-art-perf.py"
          git show "$GITHUB_SHA":.github/scripts/run-art-perf.sh > "$RUNNER_TEMP/run-art-perf.sh"
          python3 "$RUNNER_TEMP/prepare-art-perf.py"
          mkdir -p .worktrees
          cat > .worktrees/gt <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          exec flock .worktrees/.build-slot python3 scripts/build-slot-guard.py --floor-mb 3500 -- "$@"
          SH
          chmod +x .worktrees/gt gradlew
      - name: Prebuild both diagnostic APKs before starting the emulator
        run: .worktrees/gt ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --max-workers=1 --stacktrace
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compare helpers in three fresh ART processes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_atd
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -no-metrics -camera-back none
          script: bash "$RUNNER_TEMP/run-art-perf.sh"
      - name: Upload actual source manifest and instrumentation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-art-edition-memo-evidence
          path: .mutations/evidence/art-perf/
          retention-days: 7
          if-no-files-found: warn
