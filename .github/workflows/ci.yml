name: Performance candidate verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-key-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g
    steps:
      - name: Checkout exact PR candidate
        uses: actions/checkout@v5
        with:
          ref: 50f70313e436dbc090a5ff5efb50676f2d2660c9
          fetch-depth: 0
          persist-credentials: false
      - name: Check source revision
        run: test "$(git rev-parse HEAD)" = 50f70313e436dbc090a5ff5efb50676f2d2660c9
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set isolated Gradle home
        run: echo "GRADLE_USER_HOME=$RUNNER_TEMP/perf-gradle-home" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: true
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36.1 build-tools;36.0.0 platform-tools'
      - name: Prepare isolated build slot and explicit mutants
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .worktrees .mutations/patches
          cat > .worktrees/gt <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          exec flock .worktrees/.build-slot python3 scripts/build-slot-guard.py --floor-mb 3500 -- "$@"
          SH
          chmod +x .worktrees/gt gradlew
          python3 - <<'PYCODE'
          from pathlib import Path
          import difflib
          path = Path('app/src/main/java/com/slukhayka/audiobooks/data/merge/MergeKey.kt')
          source = path.read_text()
          guard = 'if (normalizedTitle.isBlank() || normalizedAuthor.isBlank()) return ""'
          assert source.count(guard) == 1
          for name, replacement in [('missing-title-guard', 'if (normalizedAuthor.isBlank()) return ""'), ('missing-author-guard', 'if (normalizedTitle.isBlank()) return ""')]:
              mutant = source.replace(guard, replacement, 1)
              patch = ''.join(difflib.unified_diff(source.splitlines(keepends=True), mutant.splitlines(keepends=True), fromfile='a/' + str(path), tofile='b/' + str(path)))
              Path('.mutations/patches/' + name + '.patch').write_text(patch)
          PYCODE
      - name: Path-selected partitions and AndroidTest compile
        run: .worktrees/gt scripts/test-changed.sh --base 85c4423b6c608b18162f440ff3044d47e76d6451
      - name: Missing title guard must be caught
        run: |
          .worktrees/gt scripts/mutate.sh --patch .mutations/patches/missing-title-guard.patch --class com.slukhayka.audiobooks.data.merge.MergeKeyTest
          scripts/mutate.sh status --class com.slukhayka.audiobooks.data.merge.MergeKeyTest
      - name: Missing author guard must be caught
        run: |
          .worktrees/gt scripts/mutate.sh --patch .mutations/patches/missing-author-guard.patch --class com.slukhayka.audiobooks.data.merge.MergeKeyTest
          scripts/mutate.sh status --class com.slukhayka.audiobooks.data.merge.MergeKeyTest
      - name: Recheck genuine source after both rollbacks
        run: |
          .worktrees/gt ./gradlew :app:validateTestPartitions :app:testPureJvm -Ptest.selectedClasses=com.slukhayka.audiobooks.data.merge.MergeKeyTest --no-daemon --stacktrace
          scripts/mutate.sh status --class com.slukhayka.audiobooks.data.merge.MergeKeyTest
          git diff --exit-code
      - name: Record source and partition selection
        if: always()
        run: |
          mkdir -p .mutations/evidence
          git rev-parse HEAD > .mutations/evidence/source-head.txt
          python3 scripts/test_partitions.py select --changed-file app/src/main/java/com/slukhayka/audiobooks/data/merge/MergeKey.kt --changed-file app/src/test/java/com/slukhayka/audiobooks/data/merge/MergeKeyTest.kt --changed-file app/src/test/java/com/slukhayka/audiobooks/data/merge/RunMergeKeyBenchmark.kt > .mutations/evidence/partitions.json
      - name: Upload bounded verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-key-verification
          path: |
            .mutations/runs.jsonl
            .mutations/evidence/
            .mutations/artifacts/
            app/build/test-results/testDebugUnitTest/TEST-*.xml
          retention-days: 7
          if-no-files-found: warn
