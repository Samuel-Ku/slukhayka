name: Startup resource and profiler replay
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: startup-performance-replay
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APK_PRODUCER: '45418466008'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 85c4423b6c608b18162f440ff3044d47e76d6451
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Download and verify already built diagnostic APKs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 85c4423b6c608b18162f440ff3044d47e76d6451
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/$APK_PRODUCER --jq .head_sha)" = 22b209deacf7ad4235c83696474c4e30e3d03f3d
          output=.mutations/evidence/startup-replay
          mkdir -p .mutations/apks "$output/producer"
          gh run download "$APK_PRODUCER" --repo "$GITHUB_REPOSITORY" --name startup-profile-apks --dir .mutations/apks
          gh run download "$APK_PRODUCER" --repo "$GITHUB_REPOSITORY" --name startup-profile-evidence --dir "$output/producer"
          sha256sum -c "$output/producer/apk-sha256.txt"
          python3 - <<'PYCODE'
          from pathlib import Path
          import hashlib,json,os,subprocess
          base='85c4423b6c608b18162f440ff3044d47e76d6451'
          root=Path('.mutations/evidence/startup-replay')
          assert (root/'producer/source-head.txt').read_text().strip()==base
          manifest=json.loads((root/'producer/probe-manifest.json').read_text())
          assert manifest['sourceCommit']==base
          for record in manifest['files']:
              original=subprocess.check_output(['git','show',base+':'+record['path']])
              assert hashlib.sha256(original).hexdigest()==record['originalSha256']
          expected={'plain.apk':'719cb8a1be60a012130432b2b5940113acdc9ce1d430bb019ee0c1896bd86bbc','probe.apk':'3382f478c75fc5b1684e00ae212c06b701208ad1c0675adb3bacfa4d24c5abf6'}
          for name,digest in expected.items():
              assert hashlib.sha256((Path('.mutations/apks')/name).read_bytes()).hexdigest()==digest
          (root/'replay-proof.json').write_text(json.dumps({'source':base,'producerRun':os.environ['APK_PRODUCER'],'producerWorkflow':'22b209deacf7ad4235c83696474c4e30e3d03f3d','replayWorkflow':os.environ['GITHUB_SHA'],'apkHashes':expected},indent=2)+'\n')
          PYCODE
          git show "$GITHUB_SHA":.github/scripts/run-startup-replay.sh > "$RUNNER_TEMP/run-startup-replay.sh"
          git show "$GITHUB_SHA":.github/scripts/startup-resource-verdict.py > "$RUNNER_TEMP/startup-resource-verdict.py"
          bash -n "$RUNNER_TEMP/run-startup-replay.sh"
          python3 -m py_compile "$RUNNER_TEMP/startup-resource-verdict.py"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Replay resource guard and collect independent profiling diagnostics
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_atd
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -no-metrics -camera-back none
          script: |
            bash -c 'resource=0; method=0; system=0; bash "$RUNNER_TEMP/run-startup-replay.sh" resource || resource=$?; bash "$RUNNER_TEMP/run-startup-replay.sh" method || method=$?; bash "$RUNNER_TEMP/run-startup-replay.sh" system || system=$?; printf "%s %s %s\n" "$resource" "$method" "$system" > .mutations/evidence/startup-replay/status.txt'
      - name: Assert only the observed resource and thread outcome
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import json,sys
          try:
              root=Path('.mutations/evidence/startup-replay')
              resource,method,system=map(int,(root/'status.txt').read_text().split())
              if resource not in [0,1]:raise ValueError('resource replay incomplete')
              reports=[json.loads((root/f'resource-{i}/resource-verdict.json').read_text())for i in range(1,4)]
              assert len({r['pid']for r in reports})==3
              red=any(r['violations']for r in reports)
              assert resource==int(red)
              summary={'scope':'resource guard only; method and system trace diagnostics are recorded separately','outcome':'red-resource-init-on-main-before-draw'if red else'green','resourceReports':reports,'methodDiagnosticStatus':method,'systemTraceStatus':system}
              (root/'resource-summary.json').write_text(json.dumps(summary,indent=2)+'\n');print(json.dumps(summary))
          except Exception as error:
              print('Infrastructure/resource replay incomplete: '+str(error),file=sys.stderr);sys.exit(2)
          sys.exit(1 if red else 0)
          PYCODE
      - name: Upload actual replay evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: startup-replay-evidence
          path: .mutations/evidence/startup-replay/
          retention-days: 7
          if-no-files-found: warn
