name: Crash diagnostics collect

on:
  schedule:
    # #417: one controlled weekly entry point; manual dispatch remains for
    # urgent validation of the same read-only collection boundary.
    - cron: '0 6 * * 5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Verify OIDC read path only; never publish an Issue'
        required: false
        default: true
        type: boolean

# #415 trust zone: the collector can read repository contents and mint an OIDC
# token, but never gets GitHub Issues/PR write access or a model credential.
permissions:
  contents: read
  id-token: write

concurrency:
  group: crash-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Require configured OIDC federation
        env:
          PROVIDER: ${{ vars.CRASHLYTICS_WIF_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.CRASHLYTICS_READER_SERVICE_ACCOUNT }}
        run: |
          test -n "$PROVIDER" && test -n "$SERVICE_ACCOUNT" || {
            echo "needs-triage: missing Crashlytics read-only OIDC configuration" >&2
            exit 2
          }
      - name: Authenticate read-only to Google through OIDC
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.CRASHLYTICS_WIF_PROVIDER }}
          service_account: ${{ vars.CRASHLYTICS_READER_SERVICE_ACCOUNT }}
          token_format: access_token
      - name: Collect only sanitized groups
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          PROJECT: ${{ vars.CRASHLYTICS_PROJECT_ID }}
          APP: ${{ vars.CRASHLYTICS_ANDROID_APP_ID }}
        run: |
          test -n "$PROJECT" && test -n "$APP" || {
            echo "needs-triage: missing Crashlytics project/app configuration" >&2
            exit 2
          }
          # This adapter issues GET only. It keeps the REST response in
          # memory and writes one allowlisted projection for downstream jobs.
          python3 scripts/crash_collect.py --project "$PROJECT" --app "$APP" --output crash-groups.json
      - name: Upload sanitized handoff only
        uses: actions/upload-artifact@v4
        with:
          name: crash-sanitized-groups
          path: crash-groups.json
          if-no-files-found: error

  queue:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The queue receives only an allowlisted artifact. It cannot read
    # Crashlytics, mint OIDC tokens, or mutate GitHub state.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: crash-sanitized-groups
      - name: Prioritize at most three proven diagnosis candidates
        run: python3 scripts/crash_queue.py --input crash-groups.json --output crash-queue.json
      - name: Upload bounded queue handoff
        uses: actions/upload-artifact@v4
        with:
          name: crash-priority-queue
          path: crash-queue.json
          if-no-files-found: error

  diagnose:
    needs: queue
    # The default manual dispatch proves only the read path. A maintainer must
    # opt out of dry_run before any model call can occur.
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # #414 trust zone: sanitized queue + public checkout + short-lived OIDC
    # token only. This job cannot read Crashlytics or write GitHub state.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: crash-priority-queue
      - name: Require the dedicated diagnosis proxy
        env:
          PROXY_URL: ${{ vars.CRASH_DIAGNOSIS_PROXY_URL }}
        run: |
          test -n "$PROXY_URL" || {
            echo "needs-triage: missing diagnosis proxy configuration" >&2
            exit 2
          }
      - name: Mint an OIDC token only for the diagnosis proxy
        env:
          AUDIENCE: crash-diagnosis-proxy
        run: |
          token="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}" | jq --raw-output '.value')"
          test -n "$token" && test "$token" != "null" || exit 2
          echo "CRASH_DIAGNOSIS_OIDC_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Run at most three read-only OpenCode diagnoses
        env:
          CRASH_DIAGNOSIS_PROXY_URL: ${{ vars.CRASH_DIAGNOSIS_PROXY_URL }}
        run: python3 scripts/crash_diagnose_batch.py --input crash-queue.json --output crash-diagnoses.json
      - name: Upload bounded diagnosis statuses
        uses: actions/upload-artifact@v4
        with:
          name: crash-diagnoses
          path: crash-diagnoses.json
          if-no-files-found: error

  publish:
    needs: [queue, diagnose]
    # A manually dispatched dry run exercises collection and queue validation
    # without granting the run a publication step. Scheduled runs publish.
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # This is the only group-publication boundary. It receives neither the
    # OIDC/Firebase credential nor a model credential.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: crash-priority-queue
      - name: Create or update every sanitized crash issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/crash_publish.py --input crash-queue.json --repo "${{ github.repository }}" --output crash-issues.json
      - name: Upload public Issue mapping
        uses: actions/upload-artifact@v4
        with:
          name: crash-public-issues
          path: crash-issues.json
          if-no-files-found: error
