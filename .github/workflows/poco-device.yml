name: Poco F3 device CI

# Opt-in, trusted main only. This workflow never accepts a PR or a source ref.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: poco-f3-device
  cancel-in-progress: false

jobs:
  build:
    name: Build trusted Poco APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require reviewed main
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo '::error::Poco device CI only runs the reviewed main branch.'
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36.1 build-tools;36.0.0 platform-tools'

      - name: Build isolated test application
        run: >-
          ./gradlew --no-daemon --max-workers=1
          --init-script .github/gradle/poco-ci.init.gradle
          :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Package APKs and provenance
        run: |
          mkdir poco-ci-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk poco-ci-artifacts/
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk poco-ci-artifacts/
          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          [[ "$("$aapt" dump packagename poco-ci-artifacts/app-debug.apk)" == com.slukhayka.audiobooks.ci.pocof3 ]]
          [[ "$("$aapt" dump packagename poco-ci-artifacts/app-debug-androidTest.apk)" == com.slukhayka.audiobooks.ci.pocof3.test ]]
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('poco-ci-artifacts')
          names = ('app-debug.apk', 'app-debug-androidTest.apk')
          hashes = {}
          for name in names:
              with (root / name).open('rb') as stream:
                  hashes[name] = hashlib.file_digest(stream, 'sha256').hexdigest()
          (root / 'manifest.json').write_text(json.dumps({
              'sourceSha': os.environ['GITHUB_SHA'],
              'applicationId': 'com.slukhayka.audiobooks.ci.pocof3',
              'sha256': hashes,
          }, indent=2) + '\n')
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: poco-ci-apks-${{ github.run_id }}
          path: poco-ci-artifacts/
          retention-days: 7
          if-no-files-found: error

      - name: Device worker handoff
        run: |
          echo 'Run the fixed Omarchy pull worker with this run ID; hosted build success is not a device verdict.' >> "$GITHUB_STEP_SUMMARY"
          echo "Run ID: $GITHUB_RUN_ID; source: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
