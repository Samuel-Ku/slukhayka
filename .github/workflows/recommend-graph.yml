name: Content graph pipeline
on:
  pull_request:
    paths:
      - 'scripts/recommend/**'
      - 'scripts/tests/test_recommend_graph.py'
      - 'app/src/test/resources/recommend/content-graph.json'
      - '.github/workflows/recommend-graph.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  worker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6
      - run: python -m unittest discover -s scripts/tests -p test_recommend_graph.py -v
