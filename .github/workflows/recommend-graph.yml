name: Content graph pipeline
on:
  pull_request:
    paths:
      - 'scripts/recommend/**'
      - 'scripts/tests/test_recommend_graph.py'
      - 'app/src/test/resources/recommend/content-graph.json'
      - '.github/workflows/recommend-graph.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  worker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6
      - run: python -m unittest discover -s scripts/tests -p test_recommend_graph.py -v
  model-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: content-graph-potion-73908c3438cf03b6a01bcb9611d62b23d0726f08
      - run: python -m pip install -r scripts/recommend/requirements.txt
      - name: Build using real pinned Model2Vec weights, then verify a warm run
        env:
          HF_HUB_DISABLE_XET: '1'
        run: |
          set -eu
          python scripts/recommend/build_graph.py \
            --catalog scripts/recommend/smoke-catalog.json \
            --cache /tmp/content-vectors.sqlite --output /tmp/content-graph.json \
            --revision 73908c3438cf03b6a01bcb9611d62b23d0726f08 > /tmp/cold.json
          python scripts/recommend/build_graph.py \
            --catalog scripts/recommend/smoke-catalog.json \
            --cache /tmp/content-vectors.sqlite --output /tmp/content-graph.json \
            --revision 73908c3438cf03b6a01bcb9611d62b23d0726f08 > /tmp/warm.json
          python - <<'PY'
          import json
          cold = json.load(open('/tmp/cold.json'))
          warm = json.load(open('/tmp/warm.json'))
          assert cold['computed'] == 4, cold
          assert warm['computed'] == 0, warm
          print({'cold': cold, 'warm': warm})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: content-graph-model-smoke
          path: |
            /tmp/content-graph.json
            /tmp/cold.json
            /tmp/warm.json
