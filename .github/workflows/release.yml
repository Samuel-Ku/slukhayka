# Release — build a signed APK on version tags and publish a GitHub Release
#
# spec-29 T1 (#210): the artifact carries the version in its name
# (slukhayka-v1.1.apk). The name is derived from the tag — this workflow fires
# on `v*` tags and the tag equals v<versionName> by convention (v1.1 ↔
# versionName "1.1"), so v1.2 and later need no workflow changes. If tag and
# versionName ever drift, the checksum step fails loudly instead of attaching
# a misnamed file.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      APK_NAME: slukhayka-${{ github.ref_name }}.apk
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore signing keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "${{ runner.temp }}/upload.jks"
          chmod 600 "${{ runner.temp }}/upload.jks"

      # ADR-0021: a release without this client config silently falls back to
      # LocalOnlyIdentity and can never create a portable recovery code.
      - name: Restore Firebase release configuration
        env:
          GOOGLE_SERVICES_RELEASE_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_RELEASE_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_RELEASE_JSON_BASE64" ]; then
            echo "Missing GOOGLE_SERVICES_RELEASE_JSON_BASE64 repository secret" >&2
            exit 1
          fi
          mkdir -p app/src/release
          printf '%s' "$GOOGLE_SERVICES_RELEASE_JSON_BASE64" | base64 -d > app/src/release/google-services.json

      - name: Build release APK
        env:
          KEYSTORE_PATH: "${{ runner.temp }}/upload.jks"
          STORE_PASSWORD: "${{ secrets.STORE_PASSWORD }}"
          KEY_PASSWORD: "${{ secrets.KEY_PASSWORD }}"
        run: ./gradlew :app:assembleRelease --no-daemon

      # assembleRelease emits app/build/outputs/renamed_apks/release/slukhayka-v1.1.apk
      # (the versioned copy produced by the renameReleaseApk task).
      - name: Checksum
        run: |
          cd app/build/outputs/renamed_apks/release
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"

      # Release notes live in docs/releases/ under TWO naming conventions:
      # the bare `v1.4.1.md` and the dated `2026-09-15-v1.4.2.md`. The action
      # used to be handed the bare name only, so a dated file silently
      # produced a release with an EMPTY body — v1.4.2 shipped that way and
      # was fixed by hand, while v1.4.1, whose file happens to be bare,
      # carried its notes. Resolve either convention, and fail loudly instead
      # of publishing a silent blank.
      - name: Resolve release notes
        id: notes
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [ -f "docs/releases/${tag}.md" ]; then
            path="docs/releases/${tag}.md"
          else
            path="$(ls docs/releases/*-"${tag}".md 2>/dev/null | head -1 || true)"
          fi
          if [ -z "${path}" ]; then
            echo "::error::No release notes for ${tag} in docs/releases/"
            exit 1
          fi
          echo "Using ${path}"
          echo "path=${path}" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            app/build/outputs/renamed_apks/release/${{ env.APK_NAME }}
            app/build/outputs/renamed_apks/release/${{ env.APK_NAME }}.sha256
