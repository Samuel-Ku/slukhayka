name: Security recovery APK

on:
  push:
    branches: [codex/security-cloud-recovery]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36.1 build-tools;36.0.0 platform-tools'
      - name: Restore existing release configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_RELEASE_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_RELEASE_JSON_BASE64 }}
        run: |
          set -eu
          test -n "$KEYSTORE_BASE64"
          test -n "$GOOGLE_SERVICES_RELEASE_JSON_BASE64"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          mkdir -p app/src/release
          printf '%s' "$GOOGLE_SERVICES_RELEASE_JSON_BASE64" | base64 -d > app/src/release/google-services.json
          python3 -m json.tool app/src/release/google-services.json >/dev/null
      - name: Keep verification builds local to Actions
        run: |
          cat > "$RUNNER_TEMP/security-build.init.gradle" <<'GRADLE'
          allprojects {
            tasks.configureEach {
              if (name.startsWith('uploadCrashlytics')) enabled = false
            }
          }
          GRADLE
      - name: Verify affected Android boundaries
        run: >-
          ./gradlew :app:testDebugUnitTest
          --tests 'com.slukhayka.audiobooks.data.identity.*'
          --tests 'com.slukhayka.audiobooks.data.privacy.TransportClientsTest'
          --tests 'com.slukhayka.audiobooks.player.PlaybackProxyTest'
          -I "$RUNNER_TEMP/security-build.init.gradle" --no-daemon
      - name: Build signed App Check candidate
        env:
          APP_CHECK_RECAPTCHA_SITE_KEY: ${{ vars.ANDROID_APP_CHECK_RECAPTCHA_SITE_KEY }}
          KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eu
          test -n "$APP_CHECK_RECAPTCHA_SITE_KEY"
          ./gradlew :app:downloadE5Model --no-daemon
          ./gradlew :app:assembleRelease -I "$RUNNER_TEMP/security-build.init.gradle" --no-daemon
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/release/app-release.apk > app/build/outputs/apk/release/app-release.apk.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: slukhayka-security-appcheck-signed
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 3
