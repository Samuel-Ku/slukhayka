name: One-off #1188 test evidence
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  reorder-dialog-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Run the changed test class only
        run: |
          ./gradlew :app:testRoomRobolectricOnly \
            --tests "com.slukhayka.audiobooks.ui.screens.ReorderChaptersDialogTest" \
            --no-daemon --stacktrace
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reorder-dialog-test-report
          path: app/build/reports/tests/testRoomRobolectricOnly/
          if-no-files-found: warn
