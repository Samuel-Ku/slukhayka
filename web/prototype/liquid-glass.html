<!doctype html>
<html lang="uk" data-variant="a" data-screen="listen" data-mode="single">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Слухайка — прототип «Liquid Glass»</title>
<!--
  ПРОТОТИП. Не продакшн-код.

  Питання: «Як би Слухайка виглядала у стилі Liquid Glass / glassmorphism?»

  Три радикально різні системи скла на тих самих п'яти екранах застосунку
  (Слухати · Огляд · Медіатека · Книга · Плеєр). Контент, копірайт і
  обкладинки взяті з реальних скриншотів docs/screenshots/, щоб варіанти
  судилися в оточенні застосунку, а не у вакуумі.

    ?variant=a  Liquid Glass     — матеріал: рефракція + спекуляр; скло лише
                                   на плаваючому шарі, контент суцільний
    ?variant=b  Frosted Paper    — світле матове скло, лінії, контент понад декором
    ?variant=c  Prismatic Bento  — глибоке скло, грані, сітка-бенто
    ?material=lg|gm              — лише для A: той самий макет, але або
                                   справжнє скло, або glassmorphism 2020 року
    ?transparency=reduced        — HIG Reduce Transparency: усе скло суцільне
    ?screen=listen|explore|library|book|player
    ?mode=single|all             — один великий макет або всі п'ять поруч

  Рефракція — не backdrop-filter. Справжнє скло ЗГИНАЄ фон, тож карта зсувів
  рахується в canvas (SDF заокругленого прямокутника → лінза) і віддається в
  SVG-фільтр як feImage перед feDisplacementMap; backdrop-filter: url(#id)
  тягне фон крізь неї. Підхід запозичено з shuding/liquid-glass.

  Скрипт не чіпає жодного продакшн-модуля і не має залежностей.
-->
<style>
/* ══════════════════════════════════════════════════════════════════════════
   0. Сторінка прототипу (поза телефоном)
   ══════════════════════════════════════════════════════════════════════════ */
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:#0b0c10; color:#e8e6e1; -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column; min-height:100vh;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(900px 600px at 12% -10%, rgba(233,161,59,.10), transparent 60%),
    radial-gradient(800px 600px at 92% 8%, rgba(96,84,220,.14), transparent 62%),
    radial-gradient(700px 700px at 50% 120%, rgba(30,180,160,.08), transparent 60%);
}
.protopbar{
  position:relative; z-index:5; display:flex; flex-wrap:wrap; gap:14px; align-items:center;
  padding:16px 22px; border-bottom:1px solid rgba(255,255,255,.08);
  background:rgba(12,13,18,.72); backdrop-filter:blur(18px);
}
.brand{display:flex; align-items:baseline; gap:10px; margin-right:auto}
.brand b{font-size:16px; letter-spacing:.2px}
.brand span{font-size:12.5px; color:#8d8a83}
.tabs{display:flex; gap:6px; flex-wrap:wrap}
.tabs button{
  font:inherit; font-size:13px; color:#c9c5bd; background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.09); border-radius:999px; padding:7px 14px; cursor:pointer;
  transition:.16s;
}
.tabs button:hover{background:rgba(255,255,255,.1)}
.tabs button[aria-current="true"]{background:#e9a13b; border-color:#e9a13b; color:#241a00; font-weight:600}
.modes{display:flex; gap:6px}
.vdesc{
  position:relative; z-index:5; padding:11px 22px; font-size:13px; color:#9d9a93;
  border-bottom:1px solid rgba(255,255,255,.06);
}
.vdesc b{color:#e9a13b; font-weight:600}

.stage{position:relative; z-index:1; flex:1; display:flex; align-items:flex-start; justify-content:center;
  padding:22px 20px 96px; overflow:auto}
.strip{display:flex; gap:34px; align-items:flex-start; flex-wrap:nowrap}

/* ── Рамка телефона ─────────────────────────────────────────────────────── */
.phone-wrap{width:390px; height:780px; flex:0 0 auto}
.phone{
  width:390px; height:780px; border-radius:46px; padding:6px; position:relative;
  background:linear-gradient(150deg,#2b2e38,#14161c 40%,#22252e);
  box-shadow:0 40px 80px -30px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.07);
}
.phone::after{ /* notch-ish */
  content:""; position:absolute; top:14px; left:50%; transform:translateX(-50%);
  width:104px; height:7px; border-radius:99px; background:rgba(0,0,0,.55); z-index:40;
}
.screen{
  width:100%; height:100%; border-radius:40px; overflow:hidden; position:relative;
  display:flex; flex-direction:column; isolation:isolate;
}
.scroll{flex:1; overflow-y:auto; overflow-x:hidden; scrollbar-width:none; position:relative; z-index:2}
.scroll::-webkit-scrollbar{display:none}

/* Режим «усі п'ять» */
html[data-mode="all"] .phone-wrap{width:254px; height:508px}
html[data-mode="all"] .phone{transform:scale(.6513); transform-origin:top left}
html[data-mode="all"] .strip{gap:24px}

/* ══════════════════════════════════════════════════════════════════════════
   1. Спільні дрібниці
   ══════════════════════════════════════════════════════════════════════════ */
.sb{display:flex; justify-content:space-between; align-items:center; padding:13px 26px 4px;
  font-size:12.5px; font-weight:600; letter-spacing:.2px; flex:0 0 auto; position:relative; z-index:20}
.sb .r{display:flex; gap:5px; align-items:center; opacity:.85}
.ic{width:19px; height:19px; flex:0 0 auto; display:block}
.ic.s{width:16px; height:16px}
.ic.l{width:24px; height:24px}
.ic.xl{width:30px; height:30px}

.cover{border-radius:12px; object-fit:cover; display:block; background:#000}
.t1{font-size:16px; font-weight:600; line-height:1.24}
.t2{font-size:13.5px; line-height:1.3}
.t3{font-size:11.5px; line-height:1.3}
.muted{opacity:.62}
.dim{opacity:.42}
.amber{color:#e9a13b}
.trunc{display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.ell{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.sect{display:flex; align-items:flex-end; justify-content:space-between; gap:10px; margin:0 0 11px}
.sect h2{margin:0; font-size:17.5px; font-weight:600; letter-spacing:.1px}
.sect .sub{font-size:12px; opacity:.55; margin-top:3px}
.kicker{font-size:11px; font-weight:700; letter-spacing:.9px; text-transform:uppercase; color:#e9a13b}
.row{display:flex; align-items:center; gap:12px}
.spread{display:flex; align-items:center; justify-content:space-between}
.stack{display:flex; flex-direction:column}
.chip{
  display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:9px 15px;
  font-size:13px; white-space:nowrap; border:1px solid transparent;
}
.badge{font-size:10.5px; font-weight:600; border-radius:7px; padding:2px 7px; letter-spacing:.2px}
.track{height:4px; border-radius:99px; overflow:hidden; position:relative}
.track .fill{height:100%; border-radius:99px}
.fab{border-radius:50%; display:grid; place-items:center; flex:0 0 auto}
.ico-btn{display:grid; place-items:center; border-radius:50%; flex:0 0 auto}

/* ══════════════════════════════════════════════════════════════════════════
   2. ВАРІАНТ A — «Liquid Glass»
   Важкий blur + saturate, спекулярний обідок, плаваюча капсульна навігація,
   кольорові блоби під склом. Темна тема.
   ══════════════════════════════════════════════════════════════════════════ */
html[data-variant="a"]{--bg:#0a0c14; --ink:#f0ede6; --mut:rgba(240,237,230,.62); --acc:#e9a13b}
html[data-variant="a"] .screen{background:var(--bg); color:var(--ink)}
.amb{position:absolute; inset:-30% -20%; z-index:0; pointer-events:none; filter:blur(0px)}
[data-variant="a"] .amb::before,[data-variant="a"] .amb::after{content:""; position:absolute; border-radius:50%}
[data-variant="a"] .amb::before{
  width:520px; height:520px; left:-160px; top:60px;
  background:radial-gradient(circle at 40% 40%, rgba(233,140,50,.55), rgba(233,120,40,.10) 55%, transparent 72%);
  animation:drift1 22s ease-in-out infinite alternate;
}
[data-variant="a"] .amb::after{
  width:560px; height:560px; right:-190px; top:-80px;
  background:radial-gradient(circle at 50% 50%, rgba(104,92,255,.5), rgba(80,70,220,.08) 55%, transparent 72%);
  animation:drift2 26s ease-in-out infinite alternate;
}
@keyframes drift1{to{transform:translate(60px,90px) scale(1.15)}}
@keyframes drift2{to{transform:translate(-70px,120px) scale(1.1)}}

/* ── A: КОНТЕНТ — суцільна поверхня. HIG: «glass is for the layer that
   floats above content, not for the content itself». Тіло тексту на склі
   над строкатою обкладинкою перестає читатися — саме на це Apple згодом
   додала контролі непрозорості в 26.1. Тож картки, рейки й читання — solid. */
[data-variant="a"] .glass{
  position:relative;
  background:#161a23;
  border:1px solid rgba(255,255,255,.07);
  box-shadow:0 1px 0 rgba(255,255,255,.03), 0 18px 34px -28px rgba(0,0,0,.95);
}
[data-variant="a"] .glass.soft{background:#131720; border-color:rgba(255,255,255,.055)}

/* ── A: ХРОМ — справжній матеріал. Рефракція через feDisplacementMap
   (скло ЗГИНАЄ те, що за ним, а не просто розмиває), спекулярна грань,
   спекуляр, що стежить за вказівником, і адаптивний тон. */
[data-variant="a"] .glass.chrome{
  background:linear-gradient(157deg,rgba(255,255,255,.135),rgba(255,255,255,.04) 42%,rgba(255,255,255,.08));
  /* Фолбек — звичайний glassmorphism. JS замінює його на url(#lg-rN)
     з картою зсувів, і тоді скло справді ЗГИНАЄ фон, а не лише милить. */
  -webkit-backdrop-filter:blur(20px) saturate(185%);
  backdrop-filter:blur(20px) saturate(185%);
  border:1px solid rgba(255,255,255,.2);
  box-shadow:
    0 22px 44px -22px rgba(0,0,0,.85),
    inset 0 1px 0 rgba(255,255,255,.45),
    inset 0 -1px 0 rgba(255,255,255,.07),
    inset 1px 0 0 rgba(255,255,255,.10);
}
/* ── A: той самий макет, але матеріал — Glassmorphism 2020. Чотири
   властивості CSS, застосовані до ВСЬОГО, включно з контентом. Саме це
   зазвичай і називають «liquid glass» в інтернеті. Перемикач у тулбарі. */
[data-variant="a"][data-material="gm"] .glass,
[data-variant="a"][data-material="gm"] .glass.soft,
[data-variant="a"][data-material="gm"] .glass.chrome{
  background:rgba(255,255,255,.11);
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.2);
  box-shadow:0 8px 32px rgba(0,0,0,.37);
  border-radius:18px;
}
[data-variant="a"][data-material="gm"] .glass.chrome::after,
[data-variant="a"][data-material="gm"] .glass.chrome::before{display:none}
[data-variant="a"][data-material="gm"] .glass.chrome>*{z-index:auto}
[data-variant="a"] .glass.chrome::before{ /* спекулярна грань */
  content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; z-index:1;
  background:linear-gradient(115deg,rgba(255,255,255,.38),transparent 22%,transparent 74%,rgba(255,255,255,.18));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude; padding:1px;
}
[data-variant="a"] .glass.chrome::after{ /* спекуляр, що зсувається за вказівником */
  content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; z-index:0;
  background:radial-gradient(150px 110px at var(--mx,50%) var(--my,-10%), rgba(255,255,255,.30), rgba(255,255,255,0) 62%);
  opacity:var(--spec,0); transition:opacity .3s ease;
}
[data-variant="a"] .glass.chrome:hover{--spec:1}
[data-variant="a"] .glass.chrome>*{position:relative; z-index:2}
[data-variant="a"] .chip{background:rgba(255,255,255,.07); border-color:rgba(255,255,255,.11);
  -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); color:var(--ink)}
[data-variant="a"] .chip.on{background:#e9a13b; border-color:#e9a13b; color:#241a00; font-weight:600}
[data-variant="a"] .badge{background:rgba(233,161,59,.16); color:#f3d9a8; border:1px solid rgba(233,161,59,.3)}
[data-variant="a"] .track{background:rgba(255,255,255,.13)}
[data-variant="a"] .track .fill{background:#e9a13b; box-shadow:0 0 12px rgba(233,161,59,.6)}
[data-variant="a"] .fab{background:#e9a13b; color:#241a00; box-shadow:0 10px 26px -8px rgba(233,161,59,.75), inset 0 1px 0 rgba(255,255,255,.5)}
[data-variant="a"] .ico-btn{background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.12)}
[data-variant="a"] .amb{position:absolute}

/* навігація: відкріплена капсула */
[data-variant="a"] .nav-outer,[data-variant="d"] .nav-outer{
  position:absolute; left:14px; right:14px; bottom:14px; z-index:30;
}
[data-variant="a"] .nav,[data-variant="d"] .nav{
  border-radius:30px; padding:8px 6px; display:grid; grid-template-columns:repeat(4,1fr);
}
[data-variant="a"] .nav a,[data-variant="d"] .nav a{
  display:flex; flex-direction:column; align-items:center; gap:3px; padding:7px 0 5px;
  border-radius:22px; color:rgba(240,237,230,.55); font-size:10.5px; text-decoration:none; position:relative;
}
[data-variant="a"] .nav a.on,[data-variant="d"] .nav a.on{color:#e9a13b}
[data-variant="a"] .nav a.on::before,[data-variant="d"] .nav a.on::before{
  content:""; position:absolute; inset:0; border-radius:22px;
  background:linear-gradient(160deg,rgba(255,255,255,.2),rgba(255,255,255,.06));
  border:1px solid rgba(255,255,255,.2); box-shadow:inset 0 1px 0 rgba(255,255,255,.5);
}
[data-variant="a"] .nav a>*,[data-variant="d"] .nav a>*{position:relative}

/* ══════════════════════════════════════════════════════════════════════════
   3. ВАРІАНТ B — «Frosted Paper»
   Світла тема. Скло майже без тону, blur 12px, волосяні лінії, майже без тіней.
   Скло лише на хромі (шапка, міні-плеєр, навігація); контент — плоскі поверхні.
   ══════════════════════════════════════════════════════════════════════════ */
html[data-variant="b"]{--bg:#FAF6EE; --ink:#211D17; --mut:rgba(33,29,23,.6); --acc:#9A6A00}
html[data-variant="b"] .screen{background:var(--bg); color:var(--ink)}
[data-variant="b"] .amb::before{
  content:""; position:absolute; inset:0;
  background:
    radial-gradient(420px 260px at 88% -6%, rgba(233,161,59,.20), transparent 68%),
    radial-gradient(380px 260px at 4% 4%, rgba(120,140,90,.10), transparent 70%);
}
[data-variant="b"] .screen::after{ /* паперове зерно */
  content:""; position:absolute; inset:0; z-index:1; pointer-events:none; opacity:.5; mix-blend-mode:multiply;
  background-image:radial-gradient(rgba(120,100,70,.12) .5px, transparent .5px);
  background-size:3px 3px;
}
[data-variant="b"] .glass{
  position:relative;
  background:rgba(255,255,255,.6);
  -webkit-backdrop-filter:blur(12px) saturate(120%);
  backdrop-filter:blur(12px) saturate(120%);
  border:1px solid rgba(255,255,255,.95);
  box-shadow:0 1px 0 rgba(120,100,70,.05), 0 18px 36px -30px rgba(90,70,40,.55);
}
[data-variant="b"] .glass.dim-glass{background:rgba(250,246,238,.66); border-color:rgba(221,211,192,.7)}
[data-variant="b"] .chip{background:#F2ECDF; border-color:#E3D9C4; color:var(--ink)}
[data-variant="b"] .chip.on{background:#9A6A00; border-color:#9A6A00; color:#fff; font-weight:600}
[data-variant="b"] .chip.ghost{background:transparent}
[data-variant="b"] .badge{background:#F7E6C3; color:#4A3200; border:1px solid #E8D2A4}
[data-variant="b"] .track{background:#E6DCC8}
[data-variant="b"] .track .fill{background:#9A6A00}
[data-variant="b"] .fab{background:#9A6A00; color:#fff}
[data-variant="b"] .ico-btn{background:rgba(255,255,255,.8); border:1px solid rgba(221,211,192,.9)}
[data-variant="b"] .hair{border-bottom:1px solid #E7DECB}
[data-variant="b"] .cardlit{background:#fff; border:1px solid #EDE5D4; border-radius:16px}

[data-variant="b"] .topbar{
  position:sticky; top:0; z-index:22; border-bottom:1px solid rgba(221,211,192,.85);
}
[data-variant="b"] .nav{
  position:absolute; left:0; right:0; bottom:0; z-index:30;
  border-top:1px solid rgba(221,211,192,.9); border-radius:0;
  display:grid; grid-template-columns:repeat(4,1fr); padding:9px 0 16px;
}
[data-variant="b"] .nav a{
  display:flex; flex-direction:column; align-items:center; gap:4px; text-decoration:none;
  color:rgba(33,29,23,.45); font-size:10.5px; letter-spacing:.2px;
}
[data-variant="b"] .nav a.on{color:#9A6A00; font-weight:600}

/* ══════════════════════════════════════════════════════════════════════════
   4. ВАРІАНТ C — «Prismatic Bento»
   Дуже темна база, blur 34px + contrast, веселкова хроматична грань,
   амбровий bloom, сітка-бенто замість рейок, док-навігація з лінзою.
   ══════════════════════════════════════════════════════════════════════════ */
html[data-variant="c"]{--bg:#05060b; --ink:#f4f2ee; --mut:rgba(244,242,238,.58); --acc:#ffb347}
html[data-variant="c"] .screen{background:var(--bg); color:var(--ink)}
[data-variant="c"] .amb::before{
  content:""; position:absolute; inset:0;
  background:
    radial-gradient(520px 420px at 18% 6%, rgba(255,120,60,.24), transparent 62%),
    radial-gradient(460px 420px at 92% 30%, rgba(124,92,255,.26), transparent 64%),
    radial-gradient(420px 380px at 40% 96%, rgba(41,208,255,.14), transparent 62%);
}
[data-variant="c"] .glass{
  position:relative;
  background:linear-gradient(150deg,rgba(255,255,255,.09),rgba(255,255,255,.028) 46%,rgba(255,255,255,.06));
  -webkit-backdrop-filter:blur(34px) saturate(220%) contrast(112%);
  backdrop-filter:blur(34px) saturate(220%) contrast(112%);
  border:1px solid rgba(255,255,255,.09);
  box-shadow:
    0 30px 60px -30px rgba(0,0,0,.95),
    inset 0 1px 0 rgba(255,255,255,.24),
    0 0 44px -18px rgba(255,150,60,.35);
}
[data-variant="c"] .glass::before{ /* хроматична грань */
  content:""; position:absolute; inset:-1px; border-radius:inherit; pointer-events:none;
  background:linear-gradient(125deg,#ff7a45,#ffd166 26%,#7c5cff 62%,#29d0ff 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude; padding:1.4px; opacity:.85;
}
[data-variant="c"] .glass.bloom{box-shadow:0 30px 60px -30px rgba(0,0,0,.95), inset 0 1px 0 rgba(255,255,255,.24), 0 0 70px -14px rgba(255,140,50,.55)}
[data-variant="c"] .chip{background:rgba(255,255,255,.055); border-color:rgba(255,255,255,.12); color:var(--ink)}
[data-variant="c"] .chip.on{background:linear-gradient(120deg,#ffb347,#ff7a45); border-color:transparent; color:#1a0e00; font-weight:700}
[data-variant="c"] .badge{background:rgba(255,179,71,.14); color:#ffd79a; border:1px solid rgba(255,179,71,.35)}
[data-variant="c"] .track{background:rgba(255,255,255,.1)}
[data-variant="c"] .track .fill{background:linear-gradient(90deg,#ff7a45,#ffb347); box-shadow:0 0 16px rgba(255,150,60,.7)}
[data-variant="c"] .fab{background:linear-gradient(140deg,#ffc46b,#ff7a45); color:#1a0e00; box-shadow:0 12px 30px -8px rgba(255,140,50,.85)}
[data-variant="c"] .ico-btn{background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.13)}

[data-variant="c"] .bento{display:grid; grid-template-columns:1fr 1fr; gap:11px}
[data-variant="c"] .bento .wide{grid-column:1/-1}
[data-variant="c"] .bento .tall{grid-row:span 2}
[data-variant="c"] .nav-outer{position:absolute; left:16px; right:16px; bottom:16px; z-index:30}
[data-variant="c"] .nav{border-radius:26px; display:grid; grid-template-columns:repeat(4,1fr); padding:7px 5px}
[data-variant="c"] .nav a{
  display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 0 4px; border-radius:20px;
  color:rgba(244,242,238,.5); font-size:10.5px; text-decoration:none; position:relative;
}
[data-variant="c"] .nav a.on{color:#ffb347}
[data-variant="c"] .nav a.on::before{
  content:""; position:absolute; inset:0; border-radius:20px;

   ══════════════════════════════════════════════════════════════════════════ */
.pl-top{display:flex; align-items:center; justify-content:space-between; padding:4px 20px 0; flex:0 0 auto; position:relative; z-index:20}
.pl-kick{font-size:11px; letter-spacing:1.4px; font-weight:700; text-transform:uppercase; opacity:.72}
.pl-art{display:grid; place-items:center; padding:6px 0 0; position:relative; z-index:2}
.pl-art img{width:198px; height:auto; border-radius:18px; display:block}
[data-variant="a"] .pl-art img{box-shadow:0 40px 70px -30px rgba(0,0,0,.95), 0 0 0 1px rgba(255,255,255,.12)}
[data-variant="b"] .pl-art img{box-shadow:0 26px 50px -30px rgba(90,70,40,.7), 0 0 0 1px rgba(120,100,70,.15)}
[data-variant="c"] .pl-art img{box-shadow:0 40px 80px -28px rgba(0,0,0,1), 0 0 60px -18px rgba(255,140,50,.55), 0 0 0 1px rgba(255,255,255,.14)}
.pl-meta{text-align:center; padding:14px 30px 0; position:relative; z-index:2}
.pl-meta h1{margin:0; font-size:22px; font-weight:700; letter-spacing:-.2px}
.pl-meta .au{font-size:14.5px; opacity:.72; margin-top:5px}
.pl-meta .nr{font-size:12px; opacity:.5; margin-top:2px}
.pl-ch{font-size:14.5px; color:#e9a13b; margin-top:8px; font-weight:600}
[data-variant="b"] .pl-ch{color:#9A6A00}
.pl-prog{padding:16px 26px 0; position:relative; z-index:2}
.pl-prog .lbl{display:flex; justify-content:space-between; font-size:11.5px; opacity:.72; margin-bottom:6px}
.pl-prog .lbl b{font-weight:600; opacity:1}
.pl-prog .t2row{margin-top:13px}
.pl-prog .t2row .lbl b{font-variant-numeric:tabular-nums}
.track.t2{height:9px; border-radius:99px; background-color:rgba(255,255,255,.07);
  background-image:repeating-linear-gradient(90deg, rgba(255,255,255,.34) 0 1px, transparent 1px 5px)}
html[data-variant="b"] .track.t2{background-color:#EAE1CE; background-image:repeating-linear-gradient(90deg, rgba(120,100,70,.32) 0 1px, transparent 1px 5px)}
.track.t2 .fill{background-color:#e9a13b; background-image:repeating-linear-gradient(90deg, rgba(36,26,0,.45) 0 1px, transparent 1px 5px); border-radius:99px}
html[data-variant="b"] .track.t2 .fill{background-color:#9A6A00; background-image:repeating-linear-gradient(90deg, rgba(255,255,255,.5) 0 1px, transparent 1px 5px)}
html[data-variant="c"] .track.t2 .fill{background-image:linear-gradient(90deg,#ff7a45,#ffb347); background-color:transparent}
.pl-ctrl{display:flex; align-items:center; justify-content:space-between; padding:18px 30px 0; position:relative; z-index:2}
.pl-ctrl .side{display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10.5px; opacity:.75}
.pl-ctrl .play{width:64px; height:64px}
.pl-tools{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin:20px 20px 0; padding:12px 6px;
  border-radius:22px; position:relative; z-index:2}
.pl-tools div{display:flex; flex-direction:column; align-items:center; gap:5px; font-size:10.5px; opacity:.85; text-align:center}

/* Міні-плеєр */
.mini{display:flex; align-items:center; gap:11px; padding:9px 12px; border-radius:18px}
.mini img{width:42px; height:42px; border-radius:10px; object-fit:cover}
.mini .ttl{font-size:13.5px; font-weight:600}
.mini .sub{font-size:11px; opacity:.6}

/* ══════════════════════════════════════════════════════════════════════════
   6. Reduce Transparency
   HIG вимагає поважати системне налаштування, а не вважати його краєм.
   Той самий перемикач: усе скло стає суцільним, рефракція й blur
   вимикаються, декоративні плями зникають.
   ══════════════════════════════════════════════════════════════════════════ */

html[data-transparency="reduced"] .glass,
html[data-transparency="reduced"] .glass.soft,
html[data-transparency="reduced"] .glass.chrome,
html[data-transparency="reduced"] .glass.dim-glass,

html[data-transparency="reduced"] .chip,

  backdrop-filter:none !important;
}

html[data-variant="a"][data-transparency="reduced"] .glass.soft,
html[data-variant="a"][data-transparency="reduced"] .glass.chrome{background:#1b1f28 !important}
html[data-variant="a"][data-transparency="reduced"] .chip,
html[data-variant="a"][data-transparency="reduced"] .ico-btn{background:#242936 !important}
html[data-variant="c"][data-transparency="reduced"] .glass{background:#12141c !important}
html[data-variant="b"][data-transparency="reduced"] .glass,
html[data-variant="b"][data-transparency="reduced"] .glass.dim-glass,
html[data-variant="b"][data-transparency="reduced"] .topbar{background:#FFFFFF !important}
html[data-variant="b"][data-transparency="reduced"] .chip,
html[data-variant="b"][data-transparency="reduced"] .ico-btn{background:#F2ECDF !important}
html[data-transparency="reduced"] .glass.chrome::after{display:none}

/* ══════════════════════════════════════════════════════════════════════════
   Рендер + перемикачі
   ══════════════════════════════════════════════════════════════════════════ */
const VARIANTS = [
  { k:'a', name:'A · Liquid Glass',   sub:'матеріал: рефракція + спекуляр, скло лише на плаваючому шарі' },
  { k:'b', name:'B · Frosted Paper',  sub:'світле матове скло, лінії, контент понад декором' },
  { k:'c', name:'C · Prismatic Bento', sub:'глибоке скло, грані, сітка-бенто' }
];
const SCREENS = { listen:screenListen, explore:screenExplore, library:screenLibrary, book:screenBook, player:screenPlayer };
const SCREEN_NAMES = { listen:'Слухати', explore:'Огляд', library:'Медіатека', book:'Книга', player:'Плеєр' };

const params = new URLSearchParams(location.search);
const state = {
  variant: VARIANTS.some(v=>v.k===params.get('variant')) ? params.get('variant') : 'a',
  screen:  SCREENS[params.get('screen')] ? params.get('screen') : 'listen',
  mode:    params.get('mode') === 'all' ? 'all' : 'single',
  // Матеріал має сенс лише для варіанта A: там той самий макет можна
  // показати або справжнім склом, або glassmorphism'ом 2020 року.
  material: params.get('material') === 'gm' ? 'gm' : 'lg',
  transparency: params.get('transparency') === 'reduced' ? 'reduced' : 'normal'
};

function syncUrl(){
  const p = new URLSearchParams();
  p.set('variant', state.variant); p.set('screen', state.screen);
  if (state.mode === 'all') p.set('mode','all');
  if (state.variant === 'a' && state.material === 'gm') p.set('material','gm');
  if (state.transparency === 'reduced') p.set('transparency','reduced');
  history.replaceState(null, '', '?' + p.toString());
}

/* ══════════════════════════════════════════════════════════════════════════
   РЕФРАКЦІЯ — те, що відрізняє Liquid Glass від glassmorphism
   ──────────────────────────────────────────────────────────────────────────
   glassmorphism лише розмиває фон. Liquid Glass його ЗГИНАЄ. У браузері
   справжня рефракція вимагає displacement mapping або шейдера — не
   backdrop-filter.

   Підхід (порт ідеї shuding/liquid-glass): рахуємо карту зсувів у canvas —
   SDF заокругленого прямокутника дає «лінзу» зі схилом біля грані, — і
   віддаємо її в SVG-фільтр як feImage (data-URI) перед feDisplacementMap.
   Далі backdrop-filter: url(#id) тягне фон крізь цю карту.

   Карти кешуються за розміром панелі: різні поверхні мають різні фільтри.
   ══════════════════════════════════════════════════════════════════════════ */
const SVGNS = 'http://www.w3.org/2000/svg';
const XLINK = 'http://www.w3.org/1999/xlink';
const filterCache = new Map();
let svgRoot = null;

function ensureSvgRoot(){
  if (svgRoot && svgRoot.isConnected) return svgRoot;
  svgRoot = document.createElementNS(SVGNS, 'svg');
  svgRoot.setAttribute('width','0'); svgRoot.setAttribute('height','0');
  svgRoot.setAttribute('aria-hidden','true');
  svgRoot.style.cssText = 'position:absolute;width:0;height:0;overflow:hidden';
  svgRoot.appendChild(document.createElementNS(SVGNS, 'defs'));
  document.body.appendChild(svgRoot);
  return svgRoot;
}

// SDF заокругленого прямокутника: < 0 всередині, 0 на грані, > 0 зовні.
function roundedRectSDF(x, y, hw, hh, r){
  const qx = Math.abs(x) - hw + r, qy = Math.abs(y) - hh + r;
  return Math.min(Math.max(qx, qy), 0) + Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) - r;
}

function buildRefractionFilter(w, h, radius){
  const W = Math.max(8, Math.round(w));
  const H = Math.max(8, Math.round(h));
  const R = Math.max(0, Math.min(radius, Math.min(W, H) / 2));
  const key = `${W}x${H}x${Math.round(R)}`;
  if (filterCache.has(key)) return filterCache.get(key);

  // Схил (bevel) сталий у пікселях, тож грань виглядає однаково і на
  // капсулі навігації, і на високому лотку плеєра.
  const bevel = Math.max(8, Math.min(34, Math.min(W, H) * 0.28));
  // A — максимальний зсув на самій грані. Тримаємо A < bevel/2, інакше
  // відображення стає немонотонним: смуга згортається в лінію й фон мажеться.
  const A = bevel * 0.40;
  const hw = W / 2, hh = H / 2;
  const eps = 1;

  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  const image = ctx.createImageData(W, H);
  const data = image.data;
  const dxs = new Float32Array(W * H);
  const dys = new Float32Array(W * H);
  let maxScale = 0;

  for (let y = 0; y < H; y++){
    for (let x = 0; x < W; x++){
      const px = x + 0.5 - hw, py = y + 0.5 - hh;
      const dist = roundedRectSDF(px, py, hw, hh, R);   // 0 на грані, <0 усередині

      // Нормаль беремо з градієнта SDF (скінченні різниці), а не «до центру»:
      // інакше на широкій панелі зсув по X роздувається разом з її шириною.
      const gx = roundedRectSDF(px + eps, py, hw, hh, R) - roundedRectSDF(px - eps, py, hw, hh, R);
      const gy = roundedRectSDF(px, py + eps, hw, hh, R) - roundedRectSDF(px, py - eps, hw, hh, R);
      const glen = Math.hypot(gx, gy) || 1;

      // Квадратичний профіль: 0 у ядрі, A на грані, строго монотонний —
      // фон стискається до обідка, а не згортається.
      const depth = Math.max(0, -dist);
      const k = Math.max(0, 1 - depth / bevel);
      const disp = A * k * k;

      const dx = -(gx / glen) * disp;
      const dy = -(gy / glen) * disp;
      const i = y * W + x;
      dxs[i] = dx; dys[i] = dy;
      const m = Math.max(Math.abs(dx), Math.abs(dy));
      if (m > maxScale) maxScale = m;
    }
  }
  if (maxScale === 0) maxScale = 1;
  for (let i = 0; i < W * H; i++){
    data[i * 4]     = (dxs[i] / maxScale + 0.5) * 255;
    data[i * 4 + 1] = (dys[i] / maxScale + 0.5) * 255;
    data[i * 4 + 2] = 0;
    data[i * 4 + 3] = 255;
  }
  ctx.putImageData(image, 0, 0);

  const root = ensureSvgRoot();
  const id = 'lg-r' + (filterCache.size + 1);
  const filter = document.createElementNS(SVGNS, 'filter');
  filter.setAttribute('id', id);
  filter.setAttribute('filterUnits', 'userSpaceOnUse');
  filter.setAttribute('colorInterpolationFilters', 'sRGB');
  filter.setAttribute('x', '0');
  filter.setAttribute('y', '0');
  filter.setAttribute('width', W);
  filter.setAttribute('height', H);

  const feImage = document.createElementNS(SVGNS, 'feImage');
  feImage.setAttribute('result', id + '-map');
  feImage.setAttribute('width', W);
  feImage.setAttribute('height', H);
  const href = canvas.toDataURL();
  feImage.setAttributeNS(XLINK, 'xlink:href', href);
  feImage.setAttribute('href', href);

  const feDisplace = document.createElementNS(SVGNS, 'feDisplacementMap');
  feDisplace.setAttribute('in', 'SourceGraphic');
  feDisplace.setAttribute('in2', id + '-map');
  feDisplace.setAttribute('xChannelSelector', 'R');
  feDisplace.setAttribute('yChannelSelector', 'G');
  feDisplace.setAttribute('scale', String(maxScale));

  filter.appendChild(feImage);
  filter.appendChild(feDisplace);
  root.firstChild.appendChild(filter);

  const record = { id, scale: maxScale, bevel, size: [W, H, R] };
  filterCache.set(key, record);
  return record;
}

/** Вішає рефракцію на кожну хромову поверхню варіанта A. */
function applyRefraction(){
  const enabled = state.variant === 'a'
    && state.material === 'lg'
    && state.transparency !== 'reduced';
  document.querySelectorAll('.screen[data-v="a"] .glass.chrome').forEach(el => {
    if (!enabled){
      el.style.backdropFilter = ''; el.style.webkitBackdropFilter = '';
      delete el.dataset.refract;
      return;
    }
    // offsetWidth/offsetHeight — layout-розмір без transform:scale режиму «усі п'ять».
    const W = el.offsetWidth, H = el.offsetHeight;
    if (!W || !H) return;
    const radius = parseFloat(getComputedStyle(el).borderTopLeftRadius) || 0;
    const { id } = buildRefractionFilter(W, H, radius);
    const value = `url(#${id}) blur(1.5px) saturate(185%)`;
    el.style.webkitBackdropFilter = value;
    el.style.backdropFilter = value;
    el.dataset.refract = id;
  });
}

function frame(screen, variant){
  return `<div class="phone-wrap"><div class="phone"><div class="screen" data-v="${variant}">
      <div class="amb"></div>
      ${SCREENS[screen](variant)}
    </div></div></div>`;
}

function render(){
  document.documentElement.dataset.variant = state.variant;
  document.documentElement.dataset.screen = state.screen;
  document.documentElement.dataset.mode = state.mode;
  document.documentElement.dataset.material = state.material;
  document.documentElement.dataset.transparency = state.transparency;

  const html = state.mode === 'all'
    ? Object.keys(SCREENS).map(s => frame(s, state.variant)).join('')
    : frame(state.screen, state.variant);
  document.getElementById('stage').innerHTML = html;

  document.querySelectorAll('#screenTabs button').forEach(b =>
    b.setAttribute('aria-current', String(b.dataset.screen === state.screen)));
  document.querySelectorAll('#modeTabs button').forEach(b =>
    b.setAttribute('aria-current', String(b.dataset.mode === state.mode)));
  document.querySelectorAll('#materialTabs button').forEach(b => {
    b.setAttribute('aria-current', String(b.dataset.material === state.material));
    b.style.display = state.variant === 'a' ? '' : 'none';
  });
  document.querySelectorAll('#rtTabs button').forEach(b =>
    b.setAttribute('aria-current', String(b.dataset.transparency === state.transparency)));

  const V = VARIANTS.find(v => v.k === state.variant);
  document.getElementById('swLabel').textContent = V.name;
  document.getElementById('swSub').textContent = V.sub;

  let desc = state.mode === 'all'
    ? `Усі п'ять екранів у варіанті <b>${V.name}</b>`
    : `Екран <b>${SCREEN_NAMES[state.screen]}</b> у варіанті <b>${V.name}</b>`;
  if (state.variant === 'a'){
    desc += state.material === 'lg'
      ? ' · матеріал <b>Liquid Glass</b>: рефракція (feDisplacementMap), спекуляр, скло лише на плаваючому шарі'
      : ' · матеріал <b>Glassmorphism</b>: ті самі чотири властивості CSS, але на всіх поверхнях — скло на склі';
  } else {
    desc += ` — <span style="opacity:.8">${V.sub}</span>`;
  }
  if (state.transparency === 'reduced') desc += ' · <b>Reduce Transparency</b>: усе скло суцільне';
  document.getElementById('vdesc').innerHTML = desc;

  // Рефракцію можна рахувати лише після того, як браузер уклав DOM.
  requestAnimationFrame(applyRefraction);
  syncUrl();
}

function cycleVariant(step){
  const i = VARIANTS.findIndex(v => v.k === state.variant);
  state.variant = VARIANTS[(i + step + VARIANTS.length) % VARIANTS.length].k;
  render();
}
document.getElementById('prev').onclick = () => cycleVariant(-1);
document.getElementById('next').onclick = () => cycleVariant(1);
document.querySelectorAll('#screenTabs button').forEach(b => b.onclick = () => {
  state.screen = b.dataset.screen; if (state.mode === 'all') state.mode = 'single'; render();
});
document.querySelectorAll('#modeTabs button').forEach(b => b.onclick = () => {
  state.mode = b.dataset.mode; render();
});
document.querySelectorAll('#materialTabs button').forEach(b => b.onclick = () => {
  state.material = b.dataset.material; render();
});
document.querySelectorAll('#rtTabs button').forEach(b => b.onclick = () => {
  state.transparency = b.dataset.transparency; render();
});

/* Спекуляр стежить за вказівником — у Apple він стежить за нахилом пристрою. */
document.getElementById('stage').addEventListener('pointermove', e => {
  const el = e.target.closest('.glass.chrome');
  if (!el) return;
  const r = el.getBoundingClientRect();
  el.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100).toFixed(1) + '%');
  el.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100).toFixed(1) + '%');
}, { passive: true });

addEventListener('keydown', e => {
  const t = document.activeElement;
  if (t && /^(INPUT|TEXTAREA)$/.test(t.tagName)) return;
  if (e.key === 'ArrowLeft')  cycleVariant(-1);
  if (e.key === 'ArrowRight') cycleVariant(1);
});

let resizeTimer = null;
addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(applyRefraction, 150);
});

render();
</script>
